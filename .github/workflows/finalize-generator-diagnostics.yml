name: Finalize generator diagnostics

on:
  push:
    branches:
      - dotnet-latest

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Add generator diagnostics finalizer'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Add diagnostics and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          generator = Path('src/AsyncEventBridge.Generators/AsyncEventBridgeAdapterGenerator.cs')
          text = generator.read_text()

          descriptor_anchor = '''    private static readonly DiagnosticDescriptor UnsupportedEventDelegate = new(
              id: "AEB001",
              title: "Unsupported event delegate",
              messageFormat: "Event '{0}.{1}' uses unsupported delegate type '{2}'. Generated event APIs require EventHandler, EventHandler<TPayload>, EventHandler<TSender, TPayload>, or a void delegate with two non-ref parameters and a non-ref-like second parameter.",
              category: "AsyncEventBridge",
              defaultSeverity: DiagnosticSeverity.Warning,
              isEnabledByDefault: true);
          '''
          descriptors = descriptor_anchor + '''
              private static readonly DiagnosticDescriptor InvalidGenerationTarget = new(
                  id: "AEB002",
                  title: "Invalid async-event generation target",
                  messageFormat: "Type '{0}' cannot be targeted by GenerateAsyncEventsFor. Generated async-event adapters require a supported class type.",
                  category: "AsyncEventBridge",
                  defaultSeverity: DiagnosticSeverity.Warning,
                  isEnabledByDefault: true);

              private static readonly DiagnosticDescriptor RedundantGenerationRequest = new(
                  id: "AEB003",
                  title: "Redundant async-event generation request",
                  messageFormat: "Async-event generation for type '{0}' was requested more than once. The redundant request is ignored.",
                  category: "AsyncEventBridge",
                  defaultSeverity: DiagnosticSeverity.Warning,
                  isEnabledByDefault: true);
          '''
          if descriptor_anchor not in text:
              raise SystemExit('descriptor anchor not found')
          text = text.replace(descriptor_anchor, descriptors, 1)

          request_anchor = '''            var targetType = requestedType.IsUnboundGenericType
                  ? requestedType.OriginalDefinition
                  : requestedType;

              if (!CanGenerateForType(targetType))
              {
                  continue;
              }

              var location = request.ApplicationSyntaxReference?.GetSyntax(context.CancellationToken).GetLocation()
                  ?? Location.None;

              if (!targets.ContainsKey(targetType))
              {
                  targets.Add(targetType, location);
              }
          '''
          request_replacement = '''            var targetType = requestedType.IsUnboundGenericType
                  ? requestedType.OriginalDefinition
                  : requestedType;
              var location = request.ApplicationSyntaxReference?.GetSyntax(context.CancellationToken).GetLocation()
                  ?? Location.None;

              if (!CanGenerateForType(targetType))
              {
                  context.ReportDiagnostic(Diagnostic.Create(
                      InvalidGenerationTarget,
                      location,
                      targetType.ToDisplayString()));
                  continue;
              }

              if (targets.ContainsKey(targetType))
              {
                  context.ReportDiagnostic(Diagnostic.Create(
                      RedundantGenerationRequest,
                      location,
                      targetType.ToDisplayString()));
                  continue;
              }

              targets.Add(targetType, location);
          '''
          if request_anchor not in text:
              raise SystemExit('request anchor not found')
          text = text.replace(request_anchor, request_replacement, 1)

          direct_anchor = '''            if (!isExternalTarget && HasGenerateAsyncEventsAttribute(typeSymbol))
              {
                  continue;
              }
          '''
          direct_replacement = '''            if (!isExternalTarget && HasGenerateAsyncEventsAttribute(typeSymbol))
              {
                  context.ReportDiagnostic(Diagnostic.Create(
                      RedundantGenerationRequest,
                      requestLocation,
                      typeSymbol.ToDisplayString()));
                  continue;
              }
          '''
          if direct_anchor not in text:
              raise SystemExit('direct target anchor not found')
          text = text.replace(direct_anchor, direct_replacement, 1)
          generator.write_text(text)

          tests = Path('tests/AsyncEventBridge.Generators.Tests/AsyncEventBridgeAdapterGeneratorTests.cs')
          text = tests.read_text()
          insert_anchor = '''    [Fact]
              public void TargetedExternalTypeDoesNotExposeNonPublicEvents()
          '''
          new_tests = '''    [Fact]
              public void ReportsAeb002ForInvalidAssemblyTarget()
              {
                  var source = RuntimeWithAssemblyAttribute(
                      "[assembly: AsyncEventBridge.GenerateAsyncEventsFor(typeof(Demo.Sensor))]") + """

                      namespace Demo
                      {
                          public struct Sensor
                          {
                          }
                      }
                      """;

                  var result = RunGenerator(source, allowGeneratorWarnings: true);
                  var diagnostic = Assert.Single(result.Diagnostics.Where(diagnostic => diagnostic.Id == "AEB002"));

                  Assert.Equal(DiagnosticSeverity.Warning, diagnostic.Severity);
                  Assert.Contains("Demo.Sensor", diagnostic.GetMessage(), StringComparison.Ordinal);
                  Assert.Empty(Assert.Single(result.Results).GeneratedSources);
              }

              [Fact]
              public void ReportsAeb003ForDuplicateAssemblyTarget()
              {
                  var source = RuntimeWithAssemblyAttribute(
                      """
                      [assembly: AsyncEventBridge.GenerateAsyncEventsFor(typeof(Demo.Sensor))]
                      [assembly: AsyncEventBridge.GenerateAsyncEventsFor(typeof(Demo.Sensor))]
                      """) + """

                      namespace Demo
                      {
                          public sealed class Sensor
                          {
                              public event EventHandler? Changed;
                          }
                      }
                      """;

                  var result = RunGenerator(source, allowGeneratorWarnings: true);
                  var diagnostic = Assert.Single(result.Diagnostics.Where(diagnostic => diagnostic.Id == "AEB003"));

                  Assert.Equal(DiagnosticSeverity.Warning, diagnostic.Severity);
                  Assert.Contains("Demo.Sensor", diagnostic.GetMessage(), StringComparison.Ordinal);
                  Assert.Single(Assert.Single(result.Results).GeneratedSources);
              }

              [Fact]
              public void ReportsAeb003WhenAssemblyTargetIsAlreadyDirectlyAnnotated()
              {
                  var source = RuntimeWithAssemblyAttribute(
                      "[assembly: AsyncEventBridge.GenerateAsyncEventsFor(typeof(Demo.Sensor))]") + """

                      namespace Demo
                      {
                          [AsyncEventBridge.GenerateAsyncEvents]
                          public sealed class Sensor
                          {
                              public event EventHandler? Changed;
                          }
                      }
                      """;

                  var result = RunGenerator(source, allowGeneratorWarnings: true);
                  var diagnostic = Assert.Single(result.Diagnostics.Where(diagnostic => diagnostic.Id == "AEB003"));

                  Assert.Equal(DiagnosticSeverity.Warning, diagnostic.Severity);
                  Assert.Contains("Demo.Sensor", diagnostic.GetMessage(), StringComparison.Ordinal);
                  Assert.Empty(Assert.Single(result.Results).GeneratedSources);
              }

              [Fact]
              public void TargetedExternalTypeDoesNotExposeNonPublicEvents()
          '''
          if insert_anchor not in text:
              raise SystemExit('test insertion anchor not found')
          text = text.replace(insert_anchor, new_tests, 1)
          tests.write_text(text)

          releases = Path('src/AsyncEventBridge.Generators/AnalyzerReleases.Unshipped.md')
          text = releases.read_text()
          release_anchor = 'AEB001 | AsyncEventBridge | Warning | Reports event delegates that cannot be bridged by generated APIs.\n'
          release_replacement = release_anchor + \
              'AEB002 | AsyncEventBridge | Warning | Reports invalid `GenerateAsyncEventsFor` target types.\n' + \
              'AEB003 | AsyncEventBridge | Warning | Reports duplicate or redundant async-event generation requests.\n'
          if release_anchor not in text:
              raise SystemExit('release tracking anchor not found')
          releases.write_text(text.replace(release_anchor, release_replacement, 1))
          PY

      - name: Restore generator tests
        run: dotnet restore tests/AsyncEventBridge.Generators.Tests/AsyncEventBridge.Generators.Tests.csproj

      - name: Build generator tests
        run: dotnet build tests/AsyncEventBridge.Generators.Tests/AsyncEventBridge.Generators.Tests.csproj -c Release --no-restore

      - name: Run generator tests
        run: dotnet test tests/AsyncEventBridge.Generators.Tests/AsyncEventBridge.Generators.Tests.csproj -c Release --no-build --no-restore

      - name: Commit validated diagnostics
        shell: bash
        run: |
          git config user.name "Perry"
          git config user.email "its_Q@hotmail.com"
          git rm .github/workflows/finalize-generator-diagnostics.yml
          git add src/AsyncEventBridge.Generators/AsyncEventBridgeAdapterGenerator.cs \
                  src/AsyncEventBridge.Generators/AnalyzerReleases.Unshipped.md \
                  tests/AsyncEventBridge.Generators.Tests/AsyncEventBridgeAdapterGeneratorTests.cs
          git commit -m "Add targeted generator diagnostics"
          git push origin HEAD:dotnet-latest
