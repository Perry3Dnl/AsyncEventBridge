name: Finalize event wait state optimization

on:
  push:
    branches:
      - dotnet-latest
    paths:
      - .github/workflows/finalize-event-wait-state.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dotnet-latest
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Remove terminal completion allocation
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/AsyncEventBridge/EventAwaiter.cs")
          text = path.read_text()

          old_fields = '''    private CancellationTokenRegistration _cancellationRegistration;
              private ITimer? _timeoutRegistration;
              private Completion? _completion;
              private int _subscriptionAttempted;
          '''
          new_fields = '''    private CancellationTokenRegistration _cancellationRegistration;
              private ITimer? _timeoutRegistration;
              private TEventArgs _result = default!;
              private Exception? _exception;
              private int _winnerClaimed;
              private int _completionKind;
              private int _subscriptionAttempted;
          '''
          if text.count(old_fields) != 1:
              raise SystemExit("field block marker mismatch")
          text = text.replace(old_fields, new_fields)

          start = text.index('    private void OnEvent(object? sender, TEventArgs eventArgs)')
          end = text.index('    private void TryFinalize()', start)
          new_completion_methods = '''    private void OnEvent(object? sender, TEventArgs eventArgs)
              {
                  CompletionKind completionKind;
                  Exception? exception = null;
          
                  lock (_predicateGate)
                  {
                      if (Volatile.Read(ref _winnerClaimed) != 0)
                      {
                          return;
                      }
          
                      try
                      {
                          if (_predicate is not null && !_predicate(eventArgs))
                          {
                              return;
                          }
          
                          completionKind = CompletionKind.Succeeded;
                      }
                      catch (Exception caughtException)
                      {
                          completionKind = CompletionKind.Faulted;
                          exception = caughtException;
                      }
          
                      if (!TryClaimWinner())
                      {
                          return;
                      }
          
                      _result = eventArgs;
                      _exception = exception;
                      Volatile.Write(ref _completionKind, (int)completionKind);
                  }
          
                  TryFinalize();
              }
          
              private void TryCancel()
              {
                  if (!TryClaimWinner())
                  {
                      return;
                  }
          
                  Volatile.Write(ref _completionKind, (int)CompletionKind.Cancelled);
                  TryFinalize();
              }
          
              private void TryTimeout()
              {
                  if (!TryClaimWinner())
                  {
                      return;
                  }
          
                  _exception = EventAwaiter.CreateTimeoutException(_timeout!.Value);
                  Volatile.Write(ref _completionKind, (int)CompletionKind.TimedOut);
                  TryFinalize();
              }
          
              private void TryFault(Exception exception)
              {
                  if (!TryClaimWinner())
                  {
                      return;
                  }
          
                  _exception = exception;
                  Volatile.Write(ref _completionKind, (int)CompletionKind.Faulted);
                  TryFinalize();
              }
          
              private bool TryClaimWinner() =>
                  Interlocked.CompareExchange(ref _winnerClaimed, 1, 0) == 0;
          
          '''
          text = text[:start] + new_completion_methods + text[end:]

          old_start_catch = '''        catch (Exception exception)
                  {
                      TryWin(Completion.Faulted(exception));
                  }
          '''
          new_start_catch = '''        catch (Exception exception)
                  {
                      TryFault(exception);
                  }
          '''
          if text.count(old_start_catch) != 1:
              raise SystemExit("Start catch marker mismatch")
          text = text.replace(old_start_catch, new_start_catch)

          old_finalize_head = '''    private void TryFinalize()
              {
                  var completion = Volatile.Read(ref _completion);
          
                  if (completion is null || Volatile.Read(ref _initializationComplete) == 0)
                  {
                      return;
                  }
          '''
          new_finalize_head = '''    private void TryFinalize()
              {
                  var completionKind = (CompletionKind)Volatile.Read(ref _completionKind);
          
                  if (completionKind == CompletionKind.Pending || Volatile.Read(ref _initializationComplete) == 0)
                  {
                      return;
                  }
          '''
          if text.count(old_finalize_head) != 1:
              raise SystemExit("TryFinalize head marker mismatch")
          text = text.replace(old_finalize_head, new_finalize_head)

          old_cleanup = '''        if (cleanupErrors is not null)
                  {
                      if (completion.Kind == CompletionKind.Faulted && completion.Exception is not null)
                      {
                          cleanupErrors.Insert(0, completion.Exception);
                      }
          
                      _completionSource.TrySetException(cleanupErrors);
                      return;
                  }
          
                  switch (completion.Kind)
                  {
                      case CompletionKind.Succeeded:
                          _completionSource.TrySetResult(completion.Result);
                          break;
                      case CompletionKind.Cancelled:
                          _completionSource.TrySetCanceled(_cancellationToken);
                          break;
                      case CompletionKind.TimedOut:
                      case CompletionKind.Faulted:
                          _completionSource.TrySetException(completion.Exception!);
                          break;
                      default:
                          _completionSource.TrySetException(new InvalidOperationException("Unknown event wait completion state."));
                          break;
                  }
          '''
          new_cleanup = '''        if (cleanupErrors is not null)
                  {
                      if (completionKind == CompletionKind.Faulted && _exception is not null)
                      {
                          cleanupErrors.Insert(0, _exception);
                      }
          
                      _completionSource.TrySetException(cleanupErrors);
                      return;
                  }
          
                  switch (completionKind)
                  {
                      case CompletionKind.Succeeded:
                          _completionSource.TrySetResult(_result);
                          break;
                      case CompletionKind.Cancelled:
                          _completionSource.TrySetCanceled(_cancellationToken);
                          break;
                      case CompletionKind.TimedOut:
                      case CompletionKind.Faulted:
                          _completionSource.TrySetException(_exception!);
                          break;
                      default:
                          _completionSource.TrySetException(new InvalidOperationException("Unknown event wait completion state."));
                          break;
                  }
          '''
          if text.count(old_cleanup) != 1:
              raise SystemExit("cleanup/switch marker mismatch")
          text = text.replace(old_cleanup, new_cleanup)

          enum_start = text.index('    private enum CompletionKind')
          class_end_marker = '''    }
          }
          '''
          old_tail = text[enum_start:]
          new_tail = '''    private enum CompletionKind
              {
                  Pending = 0,
                  Succeeded = 1,
                  Cancelled = 2,
                  TimedOut = 3,
                  Faulted = 4,
              }
          }
          '''
          if 'private sealed class Completion' not in old_tail:
              raise SystemExit("Completion class tail not found")
          text = text[:enum_start] + new_tail

          path.write_text(text)

      - name: Restore
        run: dotnet restore AsyncEventBridge.sln

      - name: Build
        run: dotnet build AsyncEventBridge.sln -c Release --no-restore

      - name: Test all race and correctness suites
        run: dotnet test AsyncEventBridge.sln -c Release --no-build

      - name: Measure optimized WaitAndRaise
        run: dotnet run -c Release --project benchmarks/AsyncEventBridge.Benchmarks --no-build -- --filter "*WaitAndRaise*" --warmupCount 3 --iterationCount 5

      - name: Commit validated optimization
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-event-wait-state.yml
          rm .github/workflows/measure-event-wait.yml
          git config user.name "Perry"
          git config user.email "its_Q@hotmail.com"
          git add -A
          git commit -m "Reduce one-shot event wait allocations"
          git push origin HEAD:dotnet-latest
