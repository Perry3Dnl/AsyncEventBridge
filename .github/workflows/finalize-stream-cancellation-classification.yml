name: Finalize stream cancellation classification

on:
  push:
    branches:
      - dotnet-latest
    paths:
      - .github/workflows/finalize-stream-cancellation-classification.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dotnet-latest
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply cancellation classification fix
        shell: python
        run: |
          from pathlib import Path

          bridge_path = Path("src/AsyncEventBridge/EventStreamBridge.cs")
          bridge = bridge_path.read_text()
          old = '''        catch (OperationCanceledException)
                  {
                      PublishCancelled();
                  }
          '''
          new = '''        catch (OperationCanceledException) when (lifetimeCts.IsCancellationRequested)
                  {
                      PublishCancelled();
                  }
          '''
          if bridge.count(old) != 1:
              raise SystemExit(f"expected exactly one cancellation catch, found {bridge.count(old)}")
          bridge_path.write_text(bridge.replace(old, new))

          tests_path = Path("tests/AsyncEventBridge.Tests/EventStreamBridgeTests.cs")
          tests = tests_path.read_text()
          marker = '''    [Fact]
              public async Task CancellationPublishesCancelled()
          '''
          inserted = '''    [Fact]
              public async Task SourceOperationCanceledExceptionWithoutBridgeCancellationPublishesFaulted()
              {
                  var expected = new OperationCanceledException("source failed independently");
                  await using EventStreamBridge<int> bridge = FaultingValues(expected).ToEventBridge();
                  var faulted = new TaskCompletionSource<Exception>(TaskCreationOptions.RunContinuationsAsynchronously);
                  var completed = 0;
                  var cancelled = 0;
          
                  bridge.Completed += (_, _) => Interlocked.Increment(ref completed);
                  bridge.Faulted += (_, e) => faulted.TrySetResult(e.Exception);
                  bridge.Cancelled += (_, _) => Interlocked.Increment(ref cancelled);
          
                  bridge.Connect();
          
                  var actual = await faulted.Task.WaitAsync(TimeSpan.FromSeconds(5));
          
                  Assert.Same(expected, actual);
                  Assert.Equal(0, completed);
                  Assert.Equal(0, cancelled);
              }
          
          ''' + marker
          if tests.count(marker) != 1:
              raise SystemExit("test insertion marker not found exactly once")
          tests_path.write_text(tests.replace(marker, inserted))

      - name: Restore
        run: dotnet restore AsyncEventBridge.sln

      - name: Build
        run: dotnet build AsyncEventBridge.sln -c Release --no-restore

      - name: Test
        run: dotnet test AsyncEventBridge.sln -c Release --no-build

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-stream-cancellation-classification.yml
          git config user.name "Perry"
          git config user.email "its_Q@hotmail.com"
          git add -A
          git commit -m "Fix stream cancellation classification"
          git push origin HEAD:dotnet-latest
