name: Finalize direct ValueTask bridge

on:
  push:
    branches:
      - dotnet-latest
    paths:
      - .github/workflows/finalize-direct-valuetask-bridge.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dotnet-latest
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Consume ValueTask directly
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}")
              p.write_text(text.replace(old, new))

          extensions = "src/AsyncEventBridge/AsyncEventBridgeExtensions.cs"
          replace_exact(extensions, "new(task.AsTask());", "new(task);", expected=2)

          bridge = "src/AsyncEventBridge/EventBridge.cs"
          replace_exact(
              bridge,
              "    private readonly Task _task;\n    private readonly object _gate = new();",
              "    private readonly Task? _task;\n    private readonly ValueTask _valueTask;\n    private readonly object _gate = new();")
          replace_exact(
              bridge,
              """    internal EventBridge(Task task)
              {
                  _task = task;
              }
          """,
              """    internal EventBridge(Task task)
              {
                  _task = task;
              }
          
              internal EventBridge(ValueTask task)
              {
                  _valueTask = task;
              }
          """)
          replace_exact(
              bridge,
              """    private async Task ObserveAsync()
              {
                  try
                  {
                      await _task.ConfigureAwait(false);
                      PublishCompleted();
                  }
                  catch (OperationCanceledException) when (_task.IsCanceled)
                  {
                      PublishCancelled();
                  }
                  catch (Exception exception)
                  {
                      PublishFaulted(exception);
                  }
              }
          """,
              """    private async Task ObserveAsync()
              {
                  try
                  {
                      if (_task is not null)
                      {
                          await _task.ConfigureAwait(false);
                      }
                      else
                      {
                          await _valueTask.ConfigureAwait(false);
                      }
          
                      PublishCompleted();
                  }
                  catch (OperationCanceledException) when (_task?.IsCanceled ?? _valueTask.IsCanceled)
                  {
                      PublishCancelled();
                  }
                  catch (Exception exception)
                  {
                      PublishFaulted(exception);
                  }
              }
          """)

          replace_exact(
              bridge,
              "    private readonly Task<T> _task;\n    private readonly object _gate = new();",
              "    private readonly Task<T>? _task;\n    private readonly ValueTask<T> _valueTask;\n    private readonly object _gate = new();")
          replace_exact(
              bridge,
              """    internal EventBridge(Task<T> task)
              {
                  _task = task;
              }
          """,
              """    internal EventBridge(Task<T> task)
              {
                  _task = task;
              }
          
              internal EventBridge(ValueTask<T> task)
              {
                  _valueTask = task;
              }
          """)
          replace_exact(
              bridge,
              """    private async Task ObserveAsync()
              {
                  try
                  {
                      var result = await _task.ConfigureAwait(false);
                      PublishCompleted(result);
                  }
                  catch (OperationCanceledException) when (_task.IsCanceled)
                  {
                      PublishCancelled();
                  }
                  catch (Exception exception)
                  {
                      PublishFaulted(exception);
                  }
              }
          """,
              """    private async Task ObserveAsync()
              {
                  try
                  {
                      T result;
          
                      if (_task is not null)
                      {
                          result = await _task.ConfigureAwait(false);
                      }
                      else
                      {
                          result = await _valueTask.ConfigureAwait(false);
                      }
          
                      PublishCompleted(result);
                  }
                  catch (OperationCanceledException) when (_task?.IsCanceled ?? _valueTask.IsCanceled)
                  {
                      PublishCancelled();
                  }
                  catch (Exception exception)
                  {
                      PublishFaulted(exception);
                  }
              }
          """)

          tests = Path("tests/AsyncEventBridge.Tests/EventBridgeTests.cs")
          text = tests.read_text()
          marker = '''    [Fact]
              public void NonGenericValueTaskBridgePublishesCancelledWithoutOtherTerminalEvents()
          '''
          inserted = '''    [Fact]
              public void ValueTaskFaultedWithOperationCanceledExceptionPublishesFaulted()
              {
                  var expected = new OperationCanceledException("faulted ValueTask");
                  var valueTask = new ValueTask<int>(Task.FromException<int>(expected));
                  using EventBridge<int> bridge = valueTask.ToEventBridge();
                  Exception? observed = null;
                  var completed = 0;
                  var cancelled = 0;
          
                  bridge.Completed += (_, _) => Interlocked.Increment(ref completed);
                  bridge.Faulted += (_, e) => observed = e.Exception;
                  bridge.Cancelled += (_, _) => Interlocked.Increment(ref cancelled);
                  bridge.Connect();
          
                  Assert.Same(expected, observed);
                  Assert.Equal(0, completed);
                  Assert.Equal(0, cancelled);
              }
          
          ''' + marker
          if text.count(marker) != 1:
              raise SystemExit("EventBridgeTests insertion marker not found")
          tests.write_text(text.replace(marker, inserted))

          benchmarks = Path("benchmarks/AsyncEventBridge.Benchmarks/EventBridgeBenchmarks.cs")
          text = benchmarks.read_text()
          field_marker = '''    private readonly BenchmarkEventArgs _singleArgs = new(42);
          '''
          field_new = '''    private readonly BenchmarkEventArgs _singleArgs = new(42);
              private int _bridgeResult;
          '''
          if text.count(field_marker) != 1:
              raise SystemExit("benchmark field marker not found")
          text = text.replace(field_marker, field_new)

          method_marker = '''    [Params(32, 256)]
              public int BurstSize { get; set; }
          '''
          methods = '''    [Benchmark]
              public int CompletedValueTaskBridge() =>
                  RunCompletedBridge(new ValueTask<int>(42).ToEventBridge());
          
              [Benchmark]
              public int CompletedValueTaskViaAsTaskBaseline() =>
                  RunCompletedBridge(new ValueTask<int>(42).AsTask().ToEventBridge());
          
              [Params(32, 256)]
              public int BurstSize { get; set; }
          '''
          if text.count(method_marker) != 1:
              raise SystemExit("benchmark method marker not found")
          text = text.replace(method_marker, methods)

          helper_marker = '''    private async Task<long> RunDropNewestBurst(bool observeDrops)
          '''
          helper = '''    private int RunCompletedBridge(EventBridge<int> bridge)
              {
                  _bridgeResult = 0;
          
                  using (bridge)
                  {
                      bridge.Completed += CaptureBridgeResult;
                      bridge.Connect();
                  }
          
                  return _bridgeResult;
              }
          
              private void CaptureBridgeResult(object? sender, AsyncValueEventArgs<int> eventArgs) =>
                  _bridgeResult = eventArgs.Value;
          
          ''' + helper_marker
          if text.count(helper_marker) != 1:
              raise SystemExit("benchmark helper marker not found")
          benchmarks.write_text(text.replace(helper_marker, helper))

      - name: Restore
        run: dotnet restore AsyncEventBridge.sln

      - name: Build
        run: dotnet build AsyncEventBridge.sln -c Release --no-restore

      - name: Test
        run: dotnet test AsyncEventBridge.sln -c Release --no-build

      - name: Run focused ValueTask benchmarks
        run: dotnet run -c Release --project benchmarks/AsyncEventBridge.Benchmarks --no-build -- --filter "*CompletedValueTask*" --warmupCount 3 --iterationCount 5

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-direct-valuetask-bridge.yml
          git config user.name "Perry"
          git config user.email "its_Q@hotmail.com"
          git add -A
          git commit -m "Consume ValueTask directly in event bridges"
          git push origin HEAD:dotnet-latest
