name: Finalize occurrence and composition integration

on:
  push:
    branches:
      - dotnet-latest

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply integration patch
        run: python3 tools/finalize_occurrence_composition.py
      - name: Fix Roslyn reference projection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/AsyncEventBridge.Generators.Tests/AsyncEventBridgeOccurrenceGeneratorTests.cs')
          text = path.read_text()
          old = '.Select(path => MetadataReference.CreateFromFile(path))'
          new = '.Select(path => (MetadataReference)MetadataReference.CreateFromFile(path))'
          if old not in text:
              raise SystemExit('Roslyn reference projection marker was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Restore
        run: dotnet restore AsyncEventBridge.sln
      - name: Format
        run: dotnet format AsyncEventBridge.sln --no-restore
      - name: Build
        run: dotnet build AsyncEventBridge.sln -c Release --no-restore
      - name: Test
        run: dotnet test AsyncEventBridge.sln -c Release --no-build
      - name: Commit validated integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-occurrence-composition.yml tools/finalize_occurrence_composition.py
          git add -A
          git commit -m "Integrate sender-aware occurrences and WaitAny"
          git push origin HEAD:dotnet-latest
