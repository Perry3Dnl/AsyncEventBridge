name: Finalize sender occurrences and composition

on:
  push:
    branches:
      - dotnet-latest

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply occurrence and composition slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"marker not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Make runtime engines extensible across focused source files.
          replace_once('src/AsyncEventBridge/EventAwaiter.cs', 'public static class EventAwaiter', 'public static partial class EventAwaiter')
          replace_once('src/AsyncEventBridge/EventStream.cs', 'public static class EventStream', 'public static partial class EventStream')

          Path('src/AsyncEventBridge/EventOccurrence.cs').write_text('''namespace AsyncEventBridge;\n\n/// <summary>Represents one event occurrence with both the original sender and payload.</summary>\npublic readonly struct EventOccurrence<TSender, TPayload>\n{\n    public EventOccurrence(TSender sender, TPayload payload)\n    {\n        Sender = sender;\n        Payload = payload;\n    }\n\n    public TSender Sender { get; }\n\n    public TPayload Payload { get; }\n}\n''')

          Path('src/AsyncEventBridge/EventWaitAnyResult.cs').write_text('''namespace AsyncEventBridge;\n\n/// <summary>Represents the winning result of a two-event asynchronous race.</summary>\npublic readonly struct EventWaitAnyResult<TFirst, TSecond>\n{\n    private readonly byte _winner;\n    private readonly TFirst _first;\n    private readonly TSecond _second;\n\n    private EventWaitAnyResult(byte winner, TFirst first, TSecond second)\n    {\n        _winner = winner;\n        _first = first;\n        _second = second;\n    }\n\n    public bool IsFirst => _winner == 1;\n\n    public bool IsSecond => _winner == 2;\n\n    public TFirst First => IsFirst\n        ? _first\n        : throw new InvalidOperationException(\"The first event did not win this wait.\");\n\n    public TSecond Second => IsSecond\n        ? _second\n        : throw new InvalidOperationException(\"The second event did not win this wait.\");\n\n    internal static EventWaitAnyResult<TFirst, TSecond> FromFirst(TFirst value) =>\n        new(1, value, default!);\n\n    internal static EventWaitAnyResult<TFirst, TSecond> FromSecond(TSecond value) =>\n        new(2, default!, value);\n}\n''')

          Path('src/AsyncEventBridge/EventAwaiter.Occurrences.cs').write_text('''namespace AsyncEventBridge;\n\npublic static partial class EventAwaiter\n{\n    /// <summary>Waits for an event while preserving both its sender and payload.</summary>\n    public static Task<EventOccurrence<TSender, TPayload>> WaitOccurrenceAsync<TSender, TPayload>(\n        Action<EventHandler<TSender, TPayload>> subscribe,\n        Action<EventHandler<TSender, TPayload>> unsubscribe,\n        Predicate<EventOccurrence<TSender, TPayload>>? predicate = null,\n        CancellationToken cancellationToken = default,\n        TimeSpan? timeout = null,\n        TimeProvider? timeProvider = null)\n    {\n        ArgumentNullException.ThrowIfNull(subscribe);\n        ArgumentNullException.ThrowIfNull(unsubscribe);\n\n        EventHandler<TSender, TPayload>? adaptedHandler = null;\n\n        return WaitAsync<EventOccurrence<TSender, TPayload>>(\n            handler =>\n            {\n                adaptedHandler = (sender, payload) =>\n                    handler(null, new EventOccurrence<TSender, TPayload>(sender, payload));\n                subscribe(adaptedHandler);\n            },\n            _ =>\n            {\n                if (adaptedHandler is not null)\n                {\n                    unsubscribe(adaptedHandler);\n                }\n            },\n            predicate,\n            cancellationToken,\n            timeout,\n            timeProvider);\n    }\n}\n''')

          Path('src/AsyncEventBridge/EventStream.Occurrences.cs').write_text('''using System.Runtime.CompilerServices;\n\nnamespace AsyncEventBridge;\n\npublic static partial class EventStream\n{\n    /// <summary>Creates an async stream that preserves both the event sender and payload.</summary>\n    public static IAsyncEnumerable<EventOccurrence<TSender, TPayload>> CreateOccurrences<TSender, TPayload>(\n        Action<EventHandler<TSender, TPayload>> subscribe,\n        Action<EventHandler<TSender, TPayload>> unsubscribe,\n        Predicate<EventOccurrence<TSender, TPayload>>? predicate = null,\n        EventStreamOptions? options = null,\n        CancellationToken cancellationToken = default)\n    {\n        ArgumentNullException.ThrowIfNull(subscribe);\n        ArgumentNullException.ThrowIfNull(unsubscribe);\n\n        return EnumerateOccurrences(\n            subscribe,\n            unsubscribe,\n            predicate,\n            options,\n            cancellationToken);\n    }\n\n    private static async IAsyncEnumerable<EventOccurrence<TSender, TPayload>> EnumerateOccurrences<TSender, TPayload>(\n        Action<EventHandler<TSender, TPayload>> subscribe,\n        Action<EventHandler<TSender, TPayload>> unsubscribe,\n        Predicate<EventOccurrence<TSender, TPayload>>? predicate,\n        EventStreamOptions? options,\n        CancellationToken creationCancellationToken,\n        [EnumeratorCancellation] CancellationToken enumerationCancellationToken = default)\n    {\n        EventHandler<TSender, TPayload>? adaptedHandler = null;\n        var stream = Create<EventOccurrence<TSender, TPayload>>(\n            handler =>\n            {\n                adaptedHandler = (sender, payload) =>\n                    handler(null, new EventOccurrence<TSender, TPayload>(sender, payload));\n                subscribe(adaptedHandler);\n            },\n            _ =>\n            {\n                if (adaptedHandler is not null)\n                {\n                    unsubscribe(adaptedHandler);\n                }\n            },\n            predicate,\n            options,\n            creationCancellationToken);\n\n        await foreach (var occurrence in stream\n            .WithCancellation(enumerationCancellationToken)\n            .ConfigureAwait(false))\n        {\n            yield return occurrence;\n        }\n    }\n}\n''')

          Path('src/AsyncEventBridge/EventAwaiter.Composition.cs').write_text('''using System.Runtime.ExceptionServices;\n\nnamespace AsyncEventBridge;\n\npublic static partial class EventAwaiter\n{\n    /// <summary>Waits until either of two cancellable asynchronous event waits completes.</summary>\n    /// <remarks>The losing wait is cancelled and observed before this method completes so event subscriptions can be cleaned up deterministically.</remarks>\n    public static async Task<EventWaitAnyResult<TFirst, TSecond>> WaitAnyAsync<TFirst, TSecond>(\n        Func<CancellationToken, Task<TFirst>> firstWait,\n        Func<CancellationToken, Task<TSecond>> secondWait,\n        CancellationToken cancellationToken = default)\n    {\n        ArgumentNullException.ThrowIfNull(firstWait);\n        ArgumentNullException.ThrowIfNull(secondWait);\n\n        using var linkedCancellation = CancellationTokenSource.CreateLinkedTokenSource(cancellationToken);\n        Task<TFirst>? firstTask = null;\n        Task<TSecond>? secondTask = null;\n\n        try\n        {\n            firstTask = firstWait(linkedCancellation.Token)\n                ?? throw new InvalidOperationException(\"The first event wait factory returned null.\");\n            secondTask = secondWait(linkedCancellation.Token)\n                ?? throw new InvalidOperationException(\"The second event wait factory returned null.\");\n        }\n        catch (Exception startException)\n        {\n            Exception? cleanupException = null;\n            try\n            {\n                linkedCancellation.Cancel();\n            }\n            catch (Exception cancellationException)\n            {\n                cleanupException = cancellationException;\n            }\n\n            if (firstTask is not null)\n            {\n                cleanupException = Combine(cleanupException, await ObserveLoserAsync(firstTask).ConfigureAwait(false));\n            }\n\n            if (cleanupException is not null)\n            {\n                throw new AggregateException(startException, cleanupException);\n            }\n\n            ExceptionDispatchInfo.Capture(startException).Throw();\n            throw;\n        }\n\n        var completed = await Task.WhenAny(firstTask, secondTask).ConfigureAwait(false);\n        Exception? cancellationFailure = null;\n\n        try\n        {\n            linkedCancellation.Cancel();\n        }\n        catch (Exception exception)\n        {\n            cancellationFailure = exception;\n        }\n\n        if (ReferenceEquals(completed, firstTask))\n        {\n            return await FinishFirstAsync(firstTask, secondTask, cancellationFailure).ConfigureAwait(false);\n        }\n\n        return await FinishSecondAsync(firstTask, secondTask, cancellationFailure).ConfigureAwait(false);\n    }\n\n    private static async Task<EventWaitAnyResult<TFirst, TSecond>> FinishFirstAsync<TFirst, TSecond>(\n        Task<TFirst> winner,\n        Task<TSecond> loser,\n        Exception? cancellationFailure)\n    {\n        TFirst value = default!;\n        Exception? winnerException = null;\n\n        try\n        {\n            value = await winner.ConfigureAwait(false);\n        }\n        catch (Exception exception)\n        {\n            winnerException = exception;\n        }\n\n        var cleanupException = Combine(cancellationFailure, await ObserveLoserAsync(loser).ConfigureAwait(false));\n        ThrowIfAny(winnerException, cleanupException);\n        return EventWaitAnyResult<TFirst, TSecond>.FromFirst(value);\n    }\n\n    private static async Task<EventWaitAnyResult<TFirst, TSecond>> FinishSecondAsync<TFirst, TSecond>(\n        Task<TFirst> loser,\n        Task<TSecond> winner,\n        Exception? cancellationFailure)\n    {\n        TSecond value = default!;\n        Exception? winnerException = null;\n\n        try\n        {\n            value = await winner.ConfigureAwait(false);\n        }\n        catch (Exception exception)\n        {\n            winnerException = exception;\n        }\n\n        var cleanupException = Combine(cancellationFailure, await ObserveLoserAsync(loser).ConfigureAwait(false));\n        ThrowIfAny(winnerException, cleanupException);\n        return EventWaitAnyResult<TFirst, TSecond>.FromSecond(value);\n    }\n\n    private static async Task<Exception?> ObserveLoserAsync(Task task)\n    {\n        try\n        {\n            await task.ConfigureAwait(false);\n            return null;\n        }\n        catch (OperationCanceledException) when (task.IsCanceled)\n        {\n            return null;\n        }\n        catch (Exception exception)\n        {\n            return exception;\n        }\n    }\n\n    private static Exception? Combine(Exception? first, Exception? second)\n    {\n        if (first is null)\n        {\n            return second;\n        }\n\n        if (second is null)\n        {\n            return first;\n        }\n\n        return new AggregateException(first, second);\n    }\n\n    private static void ThrowIfAny(Exception? winnerException, Exception? cleanupException)\n    {\n        if (winnerException is not null && cleanupException is not null)\n        {\n            throw new AggregateException(winnerException, cleanupException);\n        }\n\n        if (cleanupException is not null)\n        {\n            ExceptionDispatchInfo.Capture(cleanupException).Throw();\n        }\n\n        if (winnerException is not null)\n        {\n            ExceptionDispatchInfo.Capture(winnerException).Throw();\n        }\n    }\n}\n''')

          # Standard generator: add occurrence methods alongside existing payload methods.
          p = Path('src/AsyncEventBridge.Generators/AsyncEventBridgeGenerator.cs')
          text = p.read_text()
          old_loop = '''            AppendStreamMethods(\n                source,\n                typeSymbol,\n                item.EventSymbol,\n                item.EventArgsType,\n                item.IsGenericEventHandler,\n                item.Accessibility,\n                typeParameters);'''
          new_loop = old_loop + '''\n\n            AppendOccurrenceMethods(\n                source,\n                typeSymbol,\n                item.EventSymbol,\n                item.EventArgsType,\n                item.IsGenericEventHandler,\n                item.Accessibility,\n                typeParameters);'''
          if old_loop not in text:
              raise SystemExit('standard generator loop marker missing')
          text = text.replace(old_loop, new_loop, 1)
          marker = '    private static void AppendMethod(\n'
          occurrence_helpers = r'''    private static void AppendOccurrenceMethods(
        StringBuilder source,
        INamedTypeSymbol typeSymbol,
        IEventSymbol eventSymbol,
        string eventArgsType,
        bool isGenericEventHandler,
        string accessibility,
        TypeParameterContext typeParameters)
    {
        AppendOccurrenceWaitMethod(source, typeSymbol, eventSymbol, eventArgsType, isGenericEventHandler, accessibility, typeParameters, includeTimeout: false);
        AppendOccurrenceWaitMethod(source, typeSymbol, eventSymbol, eventArgsType, isGenericEventHandler, accessibility, typeParameters, includeTimeout: true);
        AppendOccurrenceStreamMethod(source, typeSymbol, eventSymbol, eventArgsType, isGenericEventHandler, accessibility, typeParameters, includeOptions: false);
        AppendOccurrenceStreamMethod(source, typeSymbol, eventSymbol, eventArgsType, isGenericEventHandler, accessibility, typeParameters, includeOptions: true);
    }

    private static void AppendOccurrenceWaitMethod(
        StringBuilder source,
        INamedTypeSymbol typeSymbol,
        IEventSymbol eventSymbol,
        string eventArgsType,
        bool isGenericEventHandler,
        string accessibility,
        TypeParameterContext typeParameters,
        bool includeTimeout)
    {
        var sourceType = RenderType(typeSymbol, typeParameters);
        var eventName = EscapeIdentifier(eventSymbol.Name);
        var methodName = eventSymbol.Name + "OccurrenceAsync";
        var handlerType = isGenericEventHandler
            ? $"global::System.EventHandler<{eventArgsType}>"
            : "global::System.EventHandler";
        var occurrenceType = $"global::AsyncEventBridge.EventOccurrence<global::System.Object?, {eventArgsType}>";

        source.Append("    ").Append(accessibility)
            .Append(" static global::System.Threading.Tasks.Task<")
            .Append(occurrenceType).Append("> ").Append(methodName);
        AppendMethodTypeParameters(source, typeParameters);
        source.Append("(this ").Append(sourceType).Append(" source, ");
        if (includeTimeout)
        {
            source.Append("global::System.TimeSpan timeout, ");
        }
        source.Append("global::System.Threading.CancellationToken cancellationToken = default");
        if (includeTimeout)
        {
            source.Append(", global::System.TimeProvider? timeProvider = null");
        }
        source.Append(')');
        AppendMethodConstraints(source, typeParameters);
        source.AppendLine().AppendLine("    {")
            .AppendLine("        if (source is null)")
            .AppendLine("        {")
            .AppendLine("            throw new global::System.ArgumentNullException(nameof(source));")
            .AppendLine("        }")
            .AppendLine()
            .Append("        ").Append(handlerType).AppendLine("? adaptedHandler = null;")
            .AppendLine()
            .Append("        return global::AsyncEventBridge.EventAwaiter.WaitOccurrenceAsync<global::System.Object?, ")
            .Append(eventArgsType).AppendLine(">(")
            .Append("            (global::System.EventHandler<global::System.Object?, ").Append(eventArgsType).AppendLine("> handler) =>")
            .AppendLine("            {")
            .Append("                adaptedHandler = new ").Append(handlerType).AppendLine("((sender, eventArgs) => handler(sender, eventArgs));")
            .Append("                source.").Append(eventName).AppendLine(" += adaptedHandler;")
            .AppendLine("            },")
            .Append("            (global::System.EventHandler<global::System.Object?, ").Append(eventArgsType).AppendLine("> _) =>")
            .AppendLine("            {")
            .AppendLine("                if (adaptedHandler != null)")
            .AppendLine("                {")
            .Append("                    source.").Append(eventName).AppendLine(" -= adaptedHandler;")
            .AppendLine("                }")
            .AppendLine("            },")
            .AppendLine("            null,")
            .Append("            cancellationToken");
        if (includeTimeout)
        {
            source.AppendLine(",").AppendLine("            timeout,").AppendLine("            timeProvider);");
        }
        else
        {
            source.AppendLine(");");
        }
        source.AppendLine("    }").AppendLine();
    }

    private static void AppendOccurrenceStreamMethod(
        StringBuilder source,
        INamedTypeSymbol typeSymbol,
        IEventSymbol eventSymbol,
        string eventArgsType,
        bool isGenericEventHandler,
        string accessibility,
        TypeParameterContext typeParameters,
        bool includeOptions)
    {
        var sourceType = RenderType(typeSymbol, typeParameters);
        var eventName = EscapeIdentifier(eventSymbol.Name);
        var methodName = eventSymbol.Name + "OccurrenceStream";
        var handlerType = isGenericEventHandler
            ? $"global::System.EventHandler<{eventArgsType}>"
            : "global::System.EventHandler";
        var occurrenceType = $"global::AsyncEventBridge.EventOccurrence<global::System.Object?, {eventArgsType}>";

        source.Append("    ").Append(accessibility)
            .Append(" static global::System.Collections.Generic.IAsyncEnumerable<")
            .Append(occurrenceType).Append("> ").Append(methodName);
        AppendMethodTypeParameters(source, typeParameters);
        source.Append("(this ").Append(sourceType).Append(" source, ");
        if (includeOptions)
        {
            source.Append("global::AsyncEventBridge.EventStreamOptions options, ");
        }
        source.Append("global::System.Threading.CancellationToken cancellationToken = default)");
        AppendMethodConstraints(source, typeParameters);
        source.AppendLine().AppendLine("    {")
            .AppendLine("        if (source is null)")
            .AppendLine("        {")
            .AppendLine("            throw new global::System.ArgumentNullException(nameof(source));")
            .AppendLine("        }")
            .AppendLine();
        if (includeOptions)
        {
            source.AppendLine("        if (options is null)")
                .AppendLine("        {")
                .AppendLine("            throw new global::System.ArgumentNullException(nameof(options));")
                .AppendLine("        }")
                .AppendLine();
        }
        source.Append("        ").Append(handlerType).AppendLine("? adaptedHandler = null;")
            .AppendLine()
            .Append("        return global::AsyncEventBridge.EventStream.CreateOccurrences<global::System.Object?, ")
            .Append(eventArgsType).AppendLine(">(")
            .Append("            (global::System.EventHandler<global::System.Object?, ").Append(eventArgsType).AppendLine("> handler) =>")
            .AppendLine("            {")
            .Append("                adaptedHandler = new ").Append(handlerType).AppendLine("((sender, eventArgs) => handler(sender, eventArgs));")
            .Append("                source.").Append(eventName).AppendLine(" += adaptedHandler;")
            .AppendLine("            },")
            .Append("            (global::System.EventHandler<global::System.Object?, ").Append(eventArgsType).AppendLine("> _) =>")
            .AppendLine("            {")
            .AppendLine("                if (adaptedHandler != null)")
            .AppendLine("                {")
            .Append("                    source.").Append(eventName).AppendLine(" -= adaptedHandler;")
            .AppendLine("                }")
            .AppendLine("            },")
            .AppendLine("            null,")
            .Append("            ").AppendLine(includeOptions ? "options," : "null,")
            .AppendLine("            cancellationToken);")
            .AppendLine("    }")
            .AppendLine();
    }

'''
          if marker not in text:
              raise SystemExit('standard generator insertion marker missing')
          p.write_text(text.replace(marker, occurrence_helpers + marker, 1))

          # Adapter generator: occurrence APIs preserve the delegate's actual first parameter type when safe.
          p = Path('src/AsyncEventBridge.Generators/AsyncEventBridgeAdapterGenerator.cs')
          text = p.read_text()
          old = '''            AppendWaitMethods(source, typeSymbol, item, typeParameters);\n            AppendStreamMethods(source, typeSymbol, item, typeParameters);'''
          new = old + '''\n            AppendOccurrenceMethods(source, typeSymbol, item, typeParameters);'''
          if old not in text:
              raise SystemExit('adapter loop marker missing')
          text = text.replace(old, new, 1)
          marker = '    private static void AppendStreamMethods(\n'
          adapter_helpers = r'''    private static void AppendOccurrenceMethods(
        StringBuilder source,
        INamedTypeSymbol typeSymbol,
        EventGenerationInfo item,
        TypeParameterContext typeParameters)
    {
        if (item.EventSymbol.Type is not INamedTypeSymbol delegateType ||
            delegateType.DelegateInvokeMethod is not { Parameters.Length: 2 } invokeMethod ||
            !IsAsyncPayloadCompatible(invokeMethod.Parameters[0].Type))
        {
            return;
        }

        var senderType = RenderType(invokeMethod.Parameters[0].Type, typeParameters);
        AppendOccurrenceWaitMethod(source, typeSymbol, item, senderType, typeParameters, includeTimeout: false);
        AppendOccurrenceWaitMethod(source, typeSymbol, item, senderType, typeParameters, includeTimeout: true);
        AppendOccurrenceStreamMethod(source, typeSymbol, item, senderType, typeParameters, includeOptions: false);
        AppendOccurrenceStreamMethod(source, typeSymbol, item, senderType, typeParameters, includeOptions: true);
    }

    private static void AppendOccurrenceWaitMethod(
        StringBuilder source,
        INamedTypeSymbol typeSymbol,
        EventGenerationInfo item,
        string senderType,
        TypeParameterContext typeParameters,
        bool includeTimeout)
    {
        var sourceType = RenderType(typeSymbol, typeParameters);
        var eventName = EscapeIdentifier(item.EventSymbol.Name);
        var methodName = item.EventSymbol.Name + "OccurrenceAsync";
        var occurrenceType = $"global::AsyncEventBridge.EventOccurrence<{senderType}, {item.EventArgsType}>";

        source.Append("    ").Append(item.Accessibility)
            .Append(" static global::System.Threading.Tasks.Task<")
            .Append(occurrenceType).Append("> ").Append(methodName);
        AppendMethodTypeParameters(source, typeParameters);
        source.Append("(this ").Append(sourceType).Append(" source, ");
        if (includeTimeout)
        {
            source.Append("global::System.TimeSpan timeout, ");
        }
        source.Append("global::System.Threading.CancellationToken cancellationToken = default");
        if (includeTimeout)
        {
            source.Append(", global::System.TimeProvider? timeProvider = null");
        }
        source.Append(')');
        AppendMethodConstraints(source, typeParameters);
        source.AppendLine().AppendLine("    {")
            .AppendLine("        if (source is null)")
            .AppendLine("        {")
            .AppendLine("            throw new global::System.ArgumentNullException(nameof(source));")
            .AppendLine("        }")
            .AppendLine()
            .Append("        ").Append(item.HandlerType).AppendLine("? adaptedHandler = null;")
            .AppendLine()
            .Append("        return global::AsyncEventBridge.EventAwaiter.WaitOccurrenceAsync<")
            .Append(senderType).Append(", ").Append(item.EventArgsType).AppendLine(">(")
            .Append("            (global::System.EventHandler<").Append(senderType).Append(", ").Append(item.EventArgsType).AppendLine("> handler) =>")
            .AppendLine("            {")
            .Append("                adaptedHandler = new ").Append(item.HandlerType).AppendLine("((sender, eventArgs) => handler(sender, eventArgs));")
            .Append("                source.").Append(eventName).AppendLine(" += adaptedHandler;")
            .AppendLine("            },")
            .Append("            (global::System.EventHandler<").Append(senderType).Append(", ").Append(item.EventArgsType).AppendLine("> _) =>")
            .AppendLine("            {")
            .AppendLine("                if (adaptedHandler != null)")
            .AppendLine("                {")
            .Append("                    source.").Append(eventName).AppendLine(" -= adaptedHandler;")
            .AppendLine("                }")
            .AppendLine("            },")
            .AppendLine("            null,")
            .Append("            cancellationToken");
        if (includeTimeout)
        {
            source.AppendLine(",").AppendLine("            timeout,").AppendLine("            timeProvider);");
        }
        else
        {
            source.AppendLine(");");
        }
        source.AppendLine("    }").AppendLine();
    }

    private static void AppendOccurrenceStreamMethod(
        StringBuilder source,
        INamedTypeSymbol typeSymbol,
        EventGenerationInfo item,
        string senderType,
        TypeParameterContext typeParameters,
        bool includeOptions)
    {
        var sourceType = RenderType(typeSymbol, typeParameters);
        var eventName = EscapeIdentifier(item.EventSymbol.Name);
        var methodName = item.EventSymbol.Name + "OccurrenceStream";
        var occurrenceType = $"global::AsyncEventBridge.EventOccurrence<{senderType}, {item.EventArgsType}>";

        source.Append("    ").Append(item.Accessibility)
            .Append(" static global::System.Collections.Generic.IAsyncEnumerable<")
            .Append(occurrenceType).Append("> ").Append(methodName);
        AppendMethodTypeParameters(source, typeParameters);
        source.Append("(this ").Append(sourceType).Append(" source, ");
        if (includeOptions)
        {
            source.Append("global::AsyncEventBridge.EventStreamOptions options, ");
        }
        source.Append("global::System.Threading.CancellationToken cancellationToken = default)");
        AppendMethodConstraints(source, typeParameters);
        source.AppendLine().AppendLine("    {")
            .AppendLine("        if (source is null)")
            .AppendLine("        {")
            .AppendLine("            throw new global::System.ArgumentNullException(nameof(source));")
            .AppendLine("        }")
            .AppendLine();
        if (includeOptions)
        {
            source.AppendLine("        if (options is null)")
                .AppendLine("        {")
                .AppendLine("            throw new global::System.ArgumentNullException(nameof(options));")
                .AppendLine("        }")
                .AppendLine();
        }
        source.Append("        ").Append(item.HandlerType).AppendLine("? adaptedHandler = null;")
            .AppendLine()
            .Append("        return global::AsyncEventBridge.EventStream.CreateOccurrences<")
            .Append(senderType).Append(", ").Append(item.EventArgsType).AppendLine(">(")
            .Append("            (global::System.EventHandler<").Append(senderType).Append(", ").Append(item.EventArgsType).AppendLine("> handler) =>")
            .AppendLine("            {")
            .Append("                adaptedHandler = new ").Append(item.HandlerType).AppendLine("((sender, eventArgs) => handler(sender, eventArgs));")
            .Append("                source.").Append(eventName).AppendLine(" += adaptedHandler;")
            .AppendLine("            },")
            .Append("            (global::System.EventHandler<").Append(senderType).Append(", ").Append(item.EventArgsType).AppendLine("> _) =>")
            .AppendLine("            {")
            .AppendLine("                if (adaptedHandler != null)")
            .AppendLine("                {")
            .Append("                    source.").Append(eventName).AppendLine(" -= adaptedHandler;")
            .AppendLine("                }")
            .AppendLine("            },")
            .AppendLine("            null,")
            .Append("            ").AppendLine(includeOptions ? "options," : "null,")
            .AppendLine("            cancellationToken);")
            .AppendLine("    }")
            .AppendLine();
    }

'''
          if marker not in text:
              raise SystemExit('adapter insertion marker missing')
          p.write_text(text.replace(marker, adapter_helpers + marker, 1))

          # Runtime generator stubs gain the sender-aware runtime contracts.
          stub_occurrence = '''\n            public readonly struct EventOccurrence<TSender, TPayload>\n            {\n            }\n'''
          for path in [
              'tests/AsyncEventBridge.Generators.Tests/AsyncEventBridgeGeneratorTests.cs',
              'tests/AsyncEventBridge.Generators.Tests/AsyncEventBridgeAdapterGeneratorTests.cs']:
              p = Path(path)
              text = p.read_text()
              marker = '''            public sealed class EventStreamOptions\n            {\n            }\n'''
              if stub_occurrence.strip() not in text:
                  text = text.replace(marker, marker + stub_occurrence, 1)
              wait_marker = '''                public static Task<TEventArgs> WaitAsync<TEventArgs>(\n                    Action<EventHandler<TEventArgs>> subscribe,\n                    Action<EventHandler<TEventArgs>> unsubscribe,\n                    Predicate<TEventArgs>? predicate = null,\n                    CancellationToken cancellationToken = default,\n                    TimeSpan? timeout = null,\n                    TimeProvider? timeProvider = null) => throw new NotImplementedException();\n'''
              wait_add = wait_marker + '''\n                public static Task<EventOccurrence<TSender, TPayload>> WaitOccurrenceAsync<TSender, TPayload>(\n                    Action<EventHandler<TSender, TPayload>> subscribe,\n                    Action<EventHandler<TSender, TPayload>> unsubscribe,\n                    Predicate<EventOccurrence<TSender, TPayload>>? predicate = null,\n                    CancellationToken cancellationToken = default,\n                    TimeSpan? timeout = null,\n                    TimeProvider? timeProvider = null) => throw new NotImplementedException();\n'''
              if 'WaitOccurrenceAsync<TSender, TPayload>' not in text:
                  text = text.replace(wait_marker, wait_add, 1)
              stream_marker = '''                public static IAsyncEnumerable<TEventArgs> Create<TEventArgs>(\n                    Action<EventHandler<TEventArgs>> subscribe,\n                    Action<EventHandler<TEventArgs>> unsubscribe,\n                    Predicate<TEventArgs>? predicate = null,\n                    EventStreamOptions? options = null,\n                    CancellationToken cancellationToken = default) => throw new NotImplementedException();\n'''
              stream_add = stream_marker + '''\n                public static IAsyncEnumerable<EventOccurrence<TSender, TPayload>> CreateOccurrences<TSender, TPayload>(\n                    Action<EventHandler<TSender, TPayload>> subscribe,\n                    Action<EventHandler<TSender, TPayload>> unsubscribe,\n                    Predicate<EventOccurrence<TSender, TPayload>>? predicate = null,\n                    EventStreamOptions? options = null,\n                    CancellationToken cancellationToken = default) => throw new NotImplementedException();\n'''
              if 'CreateOccurrences<TSender, TPayload>' not in text:
                  text = text.replace(stream_marker, stream_add, 1)
              p.write_text(text)

          # Generator assertions for the new APIs.
          replace_once(
              'tests/AsyncEventBridge.Generators.Tests/AsyncEventBridgeGeneratorTests.cs',
              '        Assert.Contains("IAsyncEnumerable<global::Demo.SensorEventArgs> ValueChangedStream", generatedSource, StringComparison.Ordinal);',
              '        Assert.Contains("IAsyncEnumerable<global::Demo.SensorEventArgs> ValueChangedStream", generatedSource, StringComparison.Ordinal);\n        Assert.Contains("ValueChangedOccurrenceAsync", generatedSource, StringComparison.Ordinal);\n        Assert.Contains("ValueChangedOccurrenceStream", generatedSource, StringComparison.Ordinal);')
          replace_once(
              'tests/AsyncEventBridge.Generators.Tests/AsyncEventBridgeAdapterGeneratorTests.cs',
              '        Assert.Contains("ValueChangedStream", generatedSource, StringComparison.Ordinal);\n        Assert.Contains("handler(null, eventArgs)", generatedSource, StringComparison.Ordinal);',
              '        Assert.Contains("ValueChangedStream", generatedSource, StringComparison.Ordinal);\n        Assert.Contains("ValueChangedOccurrenceAsync", generatedSource, StringComparison.Ordinal);\n        Assert.Contains("EventOccurrence<global::Demo.Sensor, global::System.Int32>", generatedSource, StringComparison.Ordinal);\n        Assert.Contains("handler(null, eventArgs)", generatedSource, StringComparison.Ordinal);')

          Path('tests/AsyncEventBridge.Tests/EventOccurrenceAndCompositionTests.cs').write_text('''namespace AsyncEventBridge.Tests;\n\npublic sealed class EventOccurrenceAndCompositionTests\n{\n    [Fact]\n    public async Task WaitOccurrencePreservesSenderAndPayload()\n    {\n        var source = new StrongSource();\n        var wait = EventAwaiter.WaitOccurrenceAsync<StrongSource, int>(\n            handler => source.Changed += handler,\n            handler => source.Changed -= handler);\n\n        source.Raise(42);\n        var occurrence = await wait;\n\n        Assert.Same(source, occurrence.Sender);\n        Assert.Equal(42, occurrence.Payload);\n        Assert.Equal(0, source.HandlerCount);\n    }\n\n    [Fact]\n    public async Task OccurrenceStreamPreservesSenderAndPayload()\n    {\n        var source = new StrongSource();\n        var stream = EventStream.CreateOccurrences<StrongSource, int>(\n            handler => source.Changed += handler,\n            handler => source.Changed -= handler);\n\n        await using var enumerator = stream.GetAsyncEnumerator();\n        var move = enumerator.MoveNextAsync().AsTask();\n        source.Raise(7);\n\n        Assert.True(await move);\n        Assert.Same(source, enumerator.Current.Sender);\n        Assert.Equal(7, enumerator.Current.Payload);\n    }\n\n    [Fact]\n    public async Task WaitAnyReturnsWinnerAndUnsubscribesLoser()\n    {\n        var first = new StrongSource();\n        var second = new StringSource();\n\n        var wait = EventAwaiter.WaitAnyAsync(\n            token => EventAwaiter.WaitAsync<int>(\n                handler => first.Changed += handler,\n                handler => first.Changed -= handler,\n                cancellationToken: token),\n            token => EventAwaiter.WaitAsync<string>(\n                handler => second.Changed += handler,\n                handler => second.Changed -= handler,\n                cancellationToken: token));\n\n        second.Raise(\"ready\");\n        var result = await wait;\n\n        Assert.True(result.IsSecond);\n        Assert.False(result.IsFirst);\n        Assert.Equal(\"ready\", result.Second);\n        Assert.Equal(0, first.HandlerCount);\n        Assert.Equal(0, second.HandlerCount);\n        Assert.Throws<InvalidOperationException>(() => _ = result.First);\n    }\n\n    private sealed class StrongSource\n    {\n        private EventHandler<StrongSource, int>? _changed;\n        public event EventHandler<StrongSource, int>? Changed\n        {\n            add => _changed += value;\n            remove => _changed -= value;\n        }\n        public int HandlerCount => _changed?.GetInvocationList().Length ?? 0;\n        public void Raise(int value) => _changed?.Invoke(this, value);\n    }\n\n    private sealed class StringSource\n    {\n        private EventHandler<string>? _changed;\n        public event EventHandler<string>? Changed\n        {\n            add => _changed += value;\n            remove => _changed -= value;\n        }\n        public int HandlerCount => _changed?.GetInvocationList().Length ?? 0;\n        public void Raise(string value) => _changed?.Invoke(this, value);\n    }\n}\n''')

          # Public API lock.
          p = Path('tests/AsyncEventBridge.Tests/PublicApiTests.cs')
          text = p.read_text()
          text = text.replace(
              '            "AsyncEventBridge.EventAwaiter",\n',
              '            "AsyncEventBridge.EventAwaiter",\n            "AsyncEventBridge.EventOccurrence`2",\n            "AsyncEventBridge.EventWaitAnyResult`2",\n', 1)
          text = text.replace(
              '        AssertMethodNames(typeof(EventAwaiter), "WaitAsync", "WaitAsync");',
              '        AssertMethodNames(typeof(EventAwaiter), "WaitAnyAsync", "WaitAsync", "WaitAsync", "WaitOccurrenceAsync");', 1)
          text = text.replace(
              '        AssertMethodNames(typeof(EventStream), "Create", "Create");',
              '        AssertMethodNames(typeof(EventStream), "Create", "Create", "CreateOccurrences");', 1)
          wait_sig = '            "System.Threading.Tasks.Task<TEventArgs> WaitAsync<TEventArgs>(System.Action<System.EventHandler<TEventArgs>> subscribe, System.Action<System.EventHandler<TEventArgs>> unsubscribe, System.Predicate<TEventArgs> predicate optional, System.Threading.CancellationToken cancellationToken optional, System.Nullable<System.TimeSpan> timeout optional, System.TimeProvider timeProvider optional)"'
          wait_new = wait_sig + ',\n            "System.Threading.Tasks.Task<AsyncEventBridge.EventOccurrence<TSender,TPayload>> WaitOccurrenceAsync<TSender,TPayload>(System.Action<System.EventHandler<TSender,TPayload>> subscribe, System.Action<System.EventHandler<TSender,TPayload>> unsubscribe, System.Predicate<AsyncEventBridge.EventOccurrence<TSender,TPayload>> predicate optional, System.Threading.CancellationToken cancellationToken optional, System.Nullable<System.TimeSpan> timeout optional, System.TimeProvider timeProvider optional)",\n            "System.Threading.Tasks.Task<AsyncEventBridge.EventWaitAnyResult<TFirst,TSecond>> WaitAnyAsync<TFirst,TSecond>(System.Func<System.Threading.CancellationToken,System.Threading.Tasks.Task<TFirst>> firstWait, System.Func<System.Threading.CancellationToken,System.Threading.Tasks.Task<TSecond>> secondWait, System.Threading.CancellationToken cancellationToken optional)"'
          if wait_sig not in text:
              raise SystemExit('public api wait signature marker missing')
          text = text.replace(wait_sig, wait_new, 1)
          stream_sig = '            "System.Collections.Generic.IAsyncEnumerable<TEventArgs> Create<TEventArgs>(System.Action<System.EventHandler<TEventArgs>> subscribe, System.Action<System.EventHandler<TEventArgs>> unsubscribe, System.Predicate<TEventArgs> predicate optional, AsyncEventBridge.EventStreamOptions options optional, System.Threading.CancellationToken cancellationToken optional)"'
          stream_new = stream_sig + ',\n            "System.Collections.Generic.IAsyncEnumerable<AsyncEventBridge.EventOccurrence<TSender,TPayload>> CreateOccurrences<TSender,TPayload>(System.Action<System.EventHandler<TSender,TPayload>> subscribe, System.Action<System.EventHandler<TSender,TPayload>> unsubscribe, System.Predicate<AsyncEventBridge.EventOccurrence<TSender,TPayload>> predicate optional, AsyncEventBridge.EventStreamOptions options optional, System.Threading.CancellationToken cancellationToken optional)"'
          if stream_sig not in text:
              raise SystemExit('public api stream signature marker missing')
          text = text.replace(stream_sig, stream_new, 1)
          prop_marker = '        AssertPropertyNames(typeof(EventStreamOptions), "Capacity", "DroppedCount", "DropObserver", "FullMode");'
          prop_new = prop_marker + '\n        AssertPropertyNames(typeof(EventOccurrence<object, int>), "Payload", "Sender");\n        AssertPropertyNames(typeof(EventWaitAnyResult<int, string>), "First", "IsFirst", "IsSecond", "Second");'
          if prop_marker not in text:
              raise SystemExit('public api property marker missing')
          text = text.replace(prop_marker, prop_new, 1)
          p.write_text(text)

          # Packaged runtime smoke: generated sender-aware APIs + heterogeneous WaitAny cleanup.
          p = Path('tests/AsyncEventBridge.PackageRuntimeSmoke/Program.cs')
          text = p.read_text()
          marker = '''if (await strongSenderWait != 321)\n{\n    throw new InvalidOperationException("The packaged EventHandler<TSender, TPayload> bridge returned the wrong value.");\n}\n'''
          addition = marker + '''\nvar occurrenceWait = strongSenderSensor.ValueChangedOccurrenceAsync();\nstrongSenderSensor.Raise(322);\nvar occurrence = await occurrenceWait;\nif (!ReferenceEquals(occurrence.Sender, strongSenderSensor) || occurrence.Payload != 322)\n{\n    throw new InvalidOperationException("The packaged sender-aware generated wait lost sender or payload information.");\n}\n\nawait using (var occurrenceStream = strongSenderSensor.ValueChangedOccurrenceStream().GetAsyncEnumerator())\n{\n    var occurrenceMove = occurrenceStream.MoveNextAsync().AsTask();\n    strongSenderSensor.Raise(323);\n    if (!await occurrenceMove || !ReferenceEquals(occurrenceStream.Current.Sender, strongSenderSensor) || occurrenceStream.Current.Payload != 323)\n    {\n        throw new InvalidOperationException("The packaged sender-aware generated stream lost sender or payload information.");\n    }\n}\n\nvar choiceSensor = new ChoiceSensor();\nvar choiceWait = EventAwaiter.WaitAnyAsync(\n    token => choiceSensor.NumberAsync(token),\n    token => choiceSensor.TextAsync(token));\nchoiceSensor.RaiseText("ready");\nvar choice = await choiceWait;\nif (!choice.IsSecond || choice.Second != "ready" || choiceSensor.NumberHandlerCount != 0 || choiceSensor.TextHandlerCount != 0)\n{\n    throw new InvalidOperationException("The packaged WaitAny composition did not return the winner and clean up the loser.");\n}\n'''
          if marker not in text:
              raise SystemExit('package smoke insertion marker missing')
          text = text.replace(marker, addition, 1)
          text += '''\n[GenerateAsyncEvents]\npublic sealed class ChoiceSensor\n{\n    private EventHandler<int>? _number;\n    private EventHandler<string>? _text;\n\n    public event EventHandler<int>? Number\n    {\n        add => _number += value;\n        remove => _number -= value;\n    }\n\n    public event EventHandler<string>? Text\n    {\n        add => _text += value;\n        remove => _text -= value;\n    }\n\n    public int NumberHandlerCount => _number?.GetInvocationList().Length ?? 0;\n    public int TextHandlerCount => _text?.GetInvocationList().Length ?? 0;\n    public void RaiseText(string value) => _text?.Invoke(this, value);\n}\n'''
          p.write_text(text)

          # Native AOT smoke proves the generated occurrence facade survives trimming/AOT.
          p = Path('tests/AsyncEventBridge.PackageAotSmoke/Program.cs')
          text = p.read_text()
          marker = '''if (await wait != 42)\n{\n    throw new InvalidOperationException("Native AOT generated Event -> Task bridge returned the wrong value.");\n}\n'''
          addition = marker + '''\nvar occurrenceWait = sensor.ValueChangedOccurrenceAsync();\nsensor.Raise(46);\nvar occurrence = await occurrenceWait;\nif (!ReferenceEquals(occurrence.Sender, sensor) || occurrence.Payload != 46)\n{\n    throw new InvalidOperationException("Native AOT sender-aware occurrence bridge returned the wrong sender or payload.");\n}\n'''
          if marker not in text:
              raise SystemExit('aot smoke marker missing')
          p.write_text(text.replace(marker, addition, 1))
          PY

