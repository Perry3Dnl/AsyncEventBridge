name: Run event wait benchmarks

on:
  push:
    branches:
      - dotnet-latest

permissions:
  contents: write

jobs:
  benchmark:
    if: github.event.head_commit.message == 'Run event wait benchmarks'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore benchmarks
        run: dotnet restore benchmarks/AsyncEventBridge.Benchmarks/AsyncEventBridge.Benchmarks.csproj

      - name: Run event wait benchmarks
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project benchmarks/AsyncEventBridge.Benchmarks/AsyncEventBridge.Benchmarks.csproj \
            --configuration Release --no-restore -- \
            --filter '*EventWaitBenchmarks*' \
            --launchCount 1 \
            --warmupCount 3 \
            --iterationCount 5 2>&1 | tee event-wait-benchmarks.log

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name "Perry"
          git config user.email "its_Q@hotmail.com"
          git rm .github/workflows/run-event-wait-benchmarks.yml
          git commit -m "Remove event wait benchmark runner"
          git push origin HEAD:dotnet-latest
