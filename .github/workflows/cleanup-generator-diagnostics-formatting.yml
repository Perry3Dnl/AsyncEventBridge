name: Cleanup generator diagnostics formatting

on:
  push:
    branches:
      - dotnet-latest

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add diagnostics formatting cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fix formatting only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/AsyncEventBridge.Generators/AsyncEventBridgeAdapterGenerator.cs')
          text = path.read_text()

          replacements = {
          '''    private static readonly DiagnosticDescriptor InvalidGenerationTarget = new(
              id: "AEB002",
              title: "Invalid async-event generation target",
              messageFormat: "Type '{0}' cannot be targeted by GenerateAsyncEventsFor. Generated async-event adapters require a supported class type.",
              category: "AsyncEventBridge",
              defaultSeverity: DiagnosticSeverity.Warning,
              isEnabledByDefault: true);
          ''': '''    private static readonly DiagnosticDescriptor InvalidGenerationTarget = new(
              id: "AEB002",
              title: "Invalid async-event generation target",
              messageFormat: "Type '{0}' cannot be targeted by GenerateAsyncEventsFor. Generated async-event adapters require a supported class type.",
              category: "AsyncEventBridge",
              defaultSeverity: DiagnosticSeverity.Warning,
              isEnabledByDefault: true);
          ''',
          '''            var targetType = requestedType.IsUnboundGenericType
                  ? requestedType.OriginalDefinition
                  : requestedType;
              var location = request.ApplicationSyntaxReference?.GetSyntax(context.CancellationToken).GetLocation()
                  ?? Location.None;

              if (!CanGenerateForType(targetType))
              {
                  context.ReportDiagnostic(Diagnostic.Create(
                      InvalidGenerationTarget,
                      location,
                      targetType.ToDisplayString()));
                  continue;
              }

              if (targets.ContainsKey(targetType))
              {
                  context.ReportDiagnostic(Diagnostic.Create(
                      RedundantGenerationRequest,
                      location,
                      targetType.ToDisplayString()));
                  continue;
              }

              targets.Add(targetType, location);
          ''': '''            var targetType = requestedType.IsUnboundGenericType
                  ? requestedType.OriginalDefinition
                  : requestedType;
              var location = request.ApplicationSyntaxReference?.GetSyntax(context.CancellationToken).GetLocation()
                  ?? Location.None;

              if (!CanGenerateForType(targetType))
              {
                  context.ReportDiagnostic(Diagnostic.Create(
                      InvalidGenerationTarget,
                      location,
                      targetType.ToDisplayString()));
                  continue;
              }

              if (targets.ContainsKey(targetType))
              {
                  context.ReportDiagnostic(Diagnostic.Create(
                      RedundantGenerationRequest,
                      location,
                      targetType.ToDisplayString()));
                  continue;
              }

              targets.Add(targetType, location);
          ''',
          '''            if (!isExternalTarget && HasGenerateAsyncEventsAttribute(typeSymbol))
              {
                  context.ReportDiagnostic(Diagnostic.Create(
                      RedundantGenerationRequest,
                      requestLocation,
                      typeSymbol.ToDisplayString()));
                  continue;
              }
          ''': '''            if (!isExternalTarget && HasGenerateAsyncEventsAttribute(typeSymbol))
              {
                  context.ReportDiagnostic(Diagnostic.Create(
                      RedundantGenerationRequest,
                      requestLocation,
                      typeSymbol.ToDisplayString()));
                  continue;
              }
          ''',
          }

          # The generated patch has structurally correct code but inconsistent leading whitespace.
          # Let dotnet-format handle only whitespace for this one source file after verifying it builds.
          path.write_text(text)
          PY

      - name: Restore
        run: dotnet restore tests/AsyncEventBridge.Generators.Tests/AsyncEventBridge.Generators.Tests.csproj

      - name: Format source file
        run: dotnet format src/AsyncEventBridge.Generators/AsyncEventBridge.Generators.csproj whitespace --include src/AsyncEventBridge.Generators/AsyncEventBridgeAdapterGenerator.cs --no-restore

      - name: Verify diff
        shell: bash
        run: |
          git diff --check
          git diff -- src/AsyncEventBridge.Generators/AsyncEventBridgeAdapterGenerator.cs

      - name: Build generator tests
        run: dotnet build tests/AsyncEventBridge.Generators.Tests/AsyncEventBridge.Generators.Tests.csproj -c Release --no-restore

      - name: Run generator tests
        run: dotnet test tests/AsyncEventBridge.Generators.Tests/AsyncEventBridge.Generators.Tests.csproj -c Release --no-build --no-restore

      - name: Commit formatting cleanup
        shell: bash
        run: |
          git config user.name "Perry"
          git config user.email "its_Q@hotmail.com"
          git rm .github/workflows/cleanup-generator-diagnostics-formatting.yml
          git add src/AsyncEventBridge.Generators/AsyncEventBridgeAdapterGenerator.cs
          git commit -m "Format generator diagnostics changes"
          git push origin HEAD:dotnet-latest
