name: CI

on:
  push:
    branches:
      - base/netstandard2.0
  pull_request:
    branches:
      - base/netstandard2.0

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve shared version
        shell: bash
        run: |
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore AsyncEventBridge.sln

      - name: Build
        run: dotnet build AsyncEventBridge.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AsyncEventBridge.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Run sensor sample
        run: timeout 15s dotnet run --project samples/SensorMonitoring/SensorMonitoring.csproj --configuration Release --no-build

      - name: Pack current version
        run: dotnet pack src/AsyncEventBridge/AsyncEventBridge.csproj --configuration Release --no-build --no-restore -o artifacts/packages

      - name: Verify .NET Standard 2.0 package contents
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="artifacts/packages/AsyncEventBridge.${VERSION}.nupkg"
          test -f "$PACKAGE"
          unzip -l "$PACKAGE" | tee artifacts/package-contents.txt
          unzip -l "$PACKAGE" | grep -q "lib/netstandard2.0/AsyncEventBridge.dll"
          unzip -l "$PACKAGE" | grep -q "lib/netstandard2.0/AsyncEventBridge.xml"
          if unzip -l "$PACKAGE" | grep -q "lib/netstandard2.1/"; then
            echo "Unexpected .NET Standard 2.1 asset in baseline package" >&2
            exit 1
          fi
          unzip -l "$PACKAGE" | grep -q "analyzers/dotnet/cs/AsyncEventBridge.Generators.dll"
          unzip -l "$PACKAGE" | grep -q "assets/AsyncEventBridge.png"
          unzip -l "$PACKAGE" | grep -q "README.md"
          unzip -p "$PACKAGE" AsyncEventBridge.nuspec | grep -q '<license type="expression">MPL-2.0</license>'

      - name: Restore packaged .NET Standard consumer
        run: dotnet restore tests/AsyncEventBridge.PackageSmoke/AsyncEventBridge.PackageSmoke.csproj --source "$PWD/artifacts/packages" --source https://api.nuget.org/v3/index.json -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Build packaged .NET Standard consumer
        run: dotnet build tests/AsyncEventBridge.PackageSmoke/AsyncEventBridge.PackageSmoke.csproj --configuration Release --no-restore -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Restore packaged runtime consumer
        run: dotnet restore tests/AsyncEventBridge.PackageRuntimeSmoke/AsyncEventBridge.PackageRuntimeSmoke.csproj --source "$PWD/artifacts/packages" --source https://api.nuget.org/v3/index.json -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Run packaged runtime consumer
        run: timeout 15s dotnet run --project tests/AsyncEventBridge.PackageRuntimeSmoke/AsyncEventBridge.PackageRuntimeSmoke.csproj --configuration Release --no-restore -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsyncEventBridge-netstandard2.0-${{ env.VERSION }}
          path: artifacts/packages/AsyncEventBridge.${{ env.VERSION }}.nupkg
          if-no-files-found: error
