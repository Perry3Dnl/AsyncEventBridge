name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AsyncEventBridge.sln

      - name: Build
        run: dotnet build AsyncEventBridge.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AsyncEventBridge.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Pack
        run: dotnet pack src/AsyncEventBridge/AsyncEventBridge.csproj --configuration Release --no-build --no-restore -p:PackageVersion=0.0.0-ci -o artifacts/packages

      - name: Verify package contents
        shell: bash
        run: |
          PACKAGE="artifacts/packages/AsyncEventBridge.0.0.0-ci.nupkg"
          test -f "$PACKAGE"
          unzip -l "$PACKAGE" | tee artifacts/package-contents.txt
          unzip -l "$PACKAGE" | grep -q "lib/netstandard2.0/AsyncEventBridge.dll"
          unzip -l "$PACKAGE" | grep -q "lib/netstandard2.0/AsyncEventBridge.xml"
          unzip -l "$PACKAGE" | grep -q "analyzers/dotnet/cs/AsyncEventBridge.Generators.dll"
          unzip -l "$PACKAGE" | grep -q "assets/AsyncEventBridge.png"
          unzip -l "$PACKAGE" | grep -q "README.md"

      - name: Restore packaged consumer
        run: dotnet restore tests/AsyncEventBridge.PackageSmoke/AsyncEventBridge.PackageSmoke.csproj --source "$PWD/artifacts/packages" --source https://api.nuget.org/v3/index.json -p:AsyncEventBridgePackageVersion=0.0.0-ci

      - name: Build packaged consumer
        run: dotnet build tests/AsyncEventBridge.PackageSmoke/AsyncEventBridge.PackageSmoke.csproj --configuration Release --no-restore -p:AsyncEventBridgePackageVersion=0.0.0-ci
