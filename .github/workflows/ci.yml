name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modern:
    name: Modern .NET
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve shared version
        shell: bash
        run: |
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Show SDK
        run: dotnet --info

      - name: Restore modern solution
        run: dotnet restore AsyncEventBridge.sln

      - name: Build modern solution
        run: dotnet build AsyncEventBridge.sln --configuration Release --no-restore

      - name: Test modern solution
        run: dotnet test AsyncEventBridge.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Run sensor sample
        run: timeout 15s dotnet run --project samples/SensorMonitoring/SensorMonitoring.csproj --configuration Release --no-build

      - name: Run property-changed interop sample
        run: timeout 15s dotnet run --project samples/PropertyChangedInterop/PropertyChangedInterop.csproj --configuration Release --no-build

      - name: Pack modern package
        run: dotnet pack src/AsyncEventBridge/AsyncEventBridge.csproj --configuration Release --no-build --no-restore -o artifacts/packages

      - name: Verify modern package contents
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="artifacts/packages/AsyncEventBridge.${VERSION}.nupkg"
          SYMBOL_PACKAGE="artifacts/packages/AsyncEventBridge.${VERSION}.snupkg"
          test -f "$PACKAGE"
          test -f "$SYMBOL_PACKAGE"
          unzip -l "$PACKAGE" | tee artifacts/package-contents.txt
          unzip -l "$PACKAGE" | grep -q "lib/net10.0/AsyncEventBridge.dll"
          unzip -l "$PACKAGE" | grep -q "lib/net10.0/AsyncEventBridge.xml"
          unzip -l "$PACKAGE" | grep -q "analyzers/dotnet/cs/AsyncEventBridge.Generators.dll"
          unzip -l "$PACKAGE" | grep -q "assets/AsyncEventBridge.png"
          unzip -l "$PACKAGE" | grep -q "README.md"
          unzip -l "$SYMBOL_PACKAGE" | grep -q "lib/net10.0/AsyncEventBridge.pdb"
          unzip -p "$PACKAGE" AsyncEventBridge.nuspec | tee artifacts/package-nuspec.xml
          grep -q '<license type="expression">MPL-2.0</license>' artifacts/package-nuspec.xml
          grep -q '<repository type="git"' artifacts/package-nuspec.xml
          grep -q 'url="https://github.com/Perry3Dnl/AsyncEventBridge.git"' artifacts/package-nuspec.xml

      - name: Restore packaged modern consumer
        run: dotnet restore tests/AsyncEventBridge.PackageSmoke/AsyncEventBridge.PackageSmoke.csproj --source "$PWD/artifacts/packages" --source https://api.nuget.org/v3/index.json -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Build packaged modern consumer
        run: dotnet build tests/AsyncEventBridge.PackageSmoke/AsyncEventBridge.PackageSmoke.csproj --configuration Release --no-restore -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Restore packaged runtime consumer
        run: dotnet restore tests/AsyncEventBridge.PackageRuntimeSmoke/AsyncEventBridge.PackageRuntimeSmoke.csproj --source "$PWD/artifacts/packages" --source https://api.nuget.org/v3/index.json -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Run packaged runtime consumer
        run: timeout 15s dotnet run --project tests/AsyncEventBridge.PackageRuntimeSmoke/AsyncEventBridge.PackageRuntimeSmoke.csproj --configuration Release --no-restore -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Restore packaged Native AOT consumer
        run: dotnet restore tests/AsyncEventBridge.PackageAotSmoke/AsyncEventBridge.PackageAotSmoke.csproj --runtime linux-x64 --source "$PWD/artifacts/packages" --source https://api.nuget.org/v3/index.json -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Publish packaged Native AOT consumer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-aot
          dotnet publish tests/AsyncEventBridge.PackageAotSmoke/AsyncEventBridge.PackageAotSmoke.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --no-restore \
            -p:AsyncEventBridgePackageVersion="$VERSION" \
            -o artifacts/native-aot 2>&1 | tee artifacts/native-aot-publish.log
          if grep -E 'warning IL[0-9]{4}' artifacts/native-aot-publish.log; then
            echo "Native AOT/trimming warnings are not allowed."
            exit 1
          fi
          test -x artifacts/native-aot/AsyncEventBridge.PackageAotSmoke

      - name: Run packaged Native AOT consumer
        run: timeout 15s ./artifacts/native-aot/AsyncEventBridge.PackageAotSmoke

      - name: Upload modern packages
        uses: actions/upload-artifact@v4
        with:
          name: AsyncEventBridge-modern-${{ env.VERSION }}
          path: |
            artifacts/packages/AsyncEventBridge.${{ env.VERSION }}.nupkg
            artifacts/packages/AsyncEventBridge.${{ env.VERSION }}.snupkg
          if-no-files-found: error

  compatibility:
    name: .NET Standard 2.0 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve shared version
        shell: bash
        run: |
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore compatibility solution
        run: dotnet restore compat/netstandard2.0/AsyncEventBridge.sln

      - name: Build compatibility solution
        run: dotnet build compat/netstandard2.0/AsyncEventBridge.sln --configuration Release --no-restore

      - name: Test compatibility solution
        run: dotnet test compat/netstandard2.0/AsyncEventBridge.sln --configuration Release --no-build --no-restore

      - name: Run compatibility sensor sample
        run: timeout 15s dotnet run --project compat/netstandard2.0/samples/SensorMonitoring/SensorMonitoring.csproj --configuration Release --no-build

      - name: Pack compatibility asset
        run: dotnet pack compat/netstandard2.0/src/AsyncEventBridge/AsyncEventBridge.csproj --configuration Release --no-build --no-restore -o artifacts/compat-packages

      - name: Verify compatibility package contents
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="artifacts/compat-packages/AsyncEventBridge.${VERSION}.nupkg"
          SYMBOL_PACKAGE="artifacts/compat-packages/AsyncEventBridge.${VERSION}.snupkg"
          test -f "$PACKAGE"
          test -f "$SYMBOL_PACKAGE"
          unzip -l "$PACKAGE" | tee artifacts/compat-package-contents.txt
          unzip -l "$PACKAGE" | grep -q "lib/netstandard2.0/AsyncEventBridge.dll"
          unzip -l "$PACKAGE" | grep -q "lib/netstandard2.0/AsyncEventBridge.xml"
          unzip -l "$PACKAGE" | grep -q "analyzers/dotnet/cs/AsyncEventBridge.Generators.dll"
          unzip -l "$PACKAGE" | grep -q "assets/AsyncEventBridge.png"
          unzip -l "$PACKAGE" | grep -q "README.md"
          unzip -l "$SYMBOL_PACKAGE" | grep -q "lib/netstandard2.0/AsyncEventBridge.pdb"

      - name: Restore packaged compatibility consumer
        run: dotnet restore compat/netstandard2.0/tests/AsyncEventBridge.PackageSmoke/AsyncEventBridge.PackageSmoke.csproj --source "$PWD/artifacts/compat-packages" --source https://api.nuget.org/v3/index.json -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Build packaged compatibility consumer
        run: dotnet build compat/netstandard2.0/tests/AsyncEventBridge.PackageSmoke/AsyncEventBridge.PackageSmoke.csproj --configuration Release --no-restore -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Restore packaged compatibility runtime consumer
        run: dotnet restore compat/netstandard2.0/tests/AsyncEventBridge.PackageRuntimeSmoke/AsyncEventBridge.PackageRuntimeSmoke.csproj --source "$PWD/artifacts/compat-packages" --source https://api.nuget.org/v3/index.json -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Run packaged compatibility runtime consumer
        run: timeout 15s dotnet run --project compat/netstandard2.0/tests/AsyncEventBridge.PackageRuntimeSmoke/AsyncEventBridge.PackageRuntimeSmoke.csproj --configuration Release --no-restore -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Upload compatibility package
        uses: actions/upload-artifact@v4
        with:
          name: AsyncEventBridge-netstandard2.0-${{ env.VERSION }}
          path: |
            artifacts/compat-packages/AsyncEventBridge.${{ env.VERSION }}.nupkg
            artifacts/compat-packages/AsyncEventBridge.${{ env.VERSION }}.snupkg
          if-no-files-found: error

  unity:
    name: Unity package
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve shared version
        shell: bash
        run: |
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify Unity package manifest and shared version
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          package_dir = Path("Packages/com.perry3d.async-event-bridge")
          manifest = json.loads((package_dir / "package.json").read_text(encoding="utf-8"))

          required = ("name", "displayName", "version", "unity", "unityRelease", "author", "description")
          missing = [field for field in required if not manifest.get(field)]
          if missing:
              raise SystemExit(f"Unity package manifest is missing required fields: {', '.join(missing)}")

          if manifest["name"] != package_dir.name:
              raise SystemExit(f"Package folder '{package_dir.name}' does not match manifest name '{manifest['name']}'")

          if manifest["version"] != os.environ["VERSION"]:
              raise SystemExit(f"Unity package version {manifest['version']} does not match shared version {os.environ['VERSION']}")

          if not re.fullmatch(r"\d{4}\.\d+", manifest["unity"]):
              raise SystemExit(f"Invalid Unity compatibility version: {manifest['unity']}")

          if not re.fullmatch(r"\d+[abfp]\d+", manifest["unityRelease"]):
              raise SystemExit(f"Invalid unityRelease value: {manifest['unityRelease']}")
          PY

      - name: Verify Unity core matches compatibility baseline
        shell: bash
        run: |
          set -euo pipefail
          for source in compat/netstandard2.0/src/AsyncEventBridge/*.cs; do
            name="$(basename "$source")"
            if [[ "$name" == "AssemblyInfo.cs" ]]; then
              continue
            fi
            unity_copy="Packages/com.perry3d.async-event-bridge/Runtime/Core/$name"
            test -f "$unity_copy"
            cmp "$source" "$unity_copy"
          done

      - name: Verify Unity package asset metadata
        shell: bash
        run: |
          set -euo pipefail
          UNITY_PACKAGE="Packages/com.perry3d.async-event-bridge"

          for root in Runtime Analyzers Tests; do
            test -f "$UNITY_PACKAGE/${root}.meta"
            while IFS= read -r asset; do
              [[ "$asset" == *.meta ]] && continue
              test -f "${asset}.meta"
            done < <(find "$UNITY_PACKAGE/$root" -mindepth 1 -print | sort)
          done

          SAMPLE_ROOT="$UNITY_PACKAGE/Samples~/Interactive Dialogue"
          test -f "$UNITY_PACKAGE/Samples~/Interactive Dialogue.meta"
          while IFS= read -r asset; do
            [[ "$asset" == *.meta ]] && continue
            test -f "${asset}.meta"
          done < <(find "$SAMPLE_ROOT" -mindepth 1 -print | sort)

          grep -q '^labels:$' "$UNITY_PACKAGE/Analyzers/AsyncEventBridge.Unity.Generators.dll.meta"
          grep -q '^- RoslynAnalyzer$' "$UNITY_PACKAGE/Analyzers/AsyncEventBridge.Unity.Generators.dll.meta"

      - name: Build Unity generator
        run: dotnet build src/AsyncEventBridge.Unity.Generators/AsyncEventBridge.Unity.Generators.csproj --configuration Release

      - name: Compile Unity runtime against Unity API stubs
        run: dotnet build tests/AsyncEventBridge.UnityCompileSmoke/AsyncEventBridge.UnityCompileSmoke.csproj --configuration Release

      - name: Upload Unity generator build
        uses: actions/upload-artifact@v4
        with:
          name: AsyncEventBridge-Unity-generator-${{ env.VERSION }}
          path: src/AsyncEventBridge.Unity.Generators/bin/Release/netstandard2.0/AsyncEventBridge.Unity.Generators.dll
          if-no-files-found: error

  unified-package:
    name: Unified NuGet
    needs:
      - modern
      - compatibility
      - unity
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve shared version
        shell: bash
        run: |
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Pack unified NuGet package
        run: dotnet pack packaging/AsyncEventBridge.Package/AsyncEventBridge.Package.csproj --configuration Release -o artifacts/unified

      - name: Verify unified package layout and dependency groups
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="artifacts/unified/AsyncEventBridge.${VERSION}.nupkg"
          SYMBOL_PACKAGE="artifacts/unified/AsyncEventBridge.${VERSION}.snupkg"
          test -f "$PACKAGE"
          test -f "$SYMBOL_PACKAGE"
          unzip -l "$PACKAGE" | tee artifacts/unified-package-contents.txt
          unzip -l "$PACKAGE" | grep -q "lib/net10.0/AsyncEventBridge.dll"
          unzip -l "$PACKAGE" | grep -q "lib/net10.0/AsyncEventBridge.xml"
          unzip -l "$PACKAGE" | grep -q "lib/netstandard2.0/AsyncEventBridge.dll"
          unzip -l "$PACKAGE" | grep -q "lib/netstandard2.0/AsyncEventBridge.xml"
          unzip -l "$PACKAGE" | grep -q "tools/generators/modern/AsyncEventBridge.Generators.dll"
          unzip -l "$PACKAGE" | grep -q "tools/generators/compat/AsyncEventBridge.Generators.dll"
          unzip -l "$PACKAGE" | grep -q "buildTransitive/AsyncEventBridge.targets"
          unzip -l "$PACKAGE" | grep -q "README.md"
          unzip -l "$PACKAGE" | grep -q "assets/AsyncEventBridge.png"
          unzip -l "$SYMBOL_PACKAGE" | grep -q "lib/net10.0/AsyncEventBridge.pdb"
          unzip -l "$SYMBOL_PACKAGE" | grep -q "lib/netstandard2.0/AsyncEventBridge.pdb"

          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          import zipfile

          package = f"artifacts/unified/AsyncEventBridge.{os.environ['VERSION']}.nupkg"
          with zipfile.ZipFile(package) as archive:
              nuspec_name = next(name for name in archive.namelist() if name.endswith(".nuspec"))
              root = ET.fromstring(archive.read(nuspec_name))

          ns = {"n": "http://schemas.microsoft.com/packaging/2013/05/nuspec.xsd"}
          groups = root.findall(".//n:dependencies/n:group", ns)
          by_tfm = {group.attrib.get("targetFramework"): group for group in groups}

          metadata = root.find("n:metadata", ns)
          repository = metadata.find("n:repository", ns) if metadata is not None else None
          if repository is None:
              raise SystemExit("Unified package is missing repository metadata")
          if repository.attrib.get("url") != "https://github.com/Perry3Dnl/AsyncEventBridge.git":
              raise SystemExit(f"Unexpected repository URL: {repository.attrib.get('url')!r}")
          if not repository.attrib.get("commit"):
              raise SystemExit("Unified package repository metadata is missing the commit SHA")

          netstandard = next((group for tfm, group in by_tfm.items() if tfm and "NETStandard2.0" in tfm), None)
          if netstandard is None:
              raise SystemExit("Missing .NET Standard 2.0 dependency group")

          dependencies = [d.attrib.get("id") for d in netstandard.findall("n:dependency", ns)]
          if "Microsoft.Bcl.AsyncInterfaces" not in dependencies:
              raise SystemExit("Compatibility dependency group is missing Microsoft.Bcl.AsyncInterfaces")

          for tfm, group in by_tfm.items():
              if tfm and "NET10.0" in tfm:
                  ids = [d.attrib.get("id") for d in group.findall("n:dependency", ns)]
                  if "Microsoft.Bcl.AsyncInterfaces" in ids:
                      raise SystemExit("Modern dependency group must not depend on Microsoft.Bcl.AsyncInterfaces")
          PY

      - name: Verify generator selection across compatible TFMs
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="tests/AsyncEventBridge.PackageTargetSelection/VerifyGeneratorSelection.proj"
          dotnet msbuild "$PROJECT" -t:Verify -p:TargetFramework=netstandard2.0 -p:ExpectedGenerator=compat
          dotnet msbuild "$PROJECT" -t:Verify -p:TargetFramework=netstandard2.1 -p:ExpectedGenerator=compat
          dotnet msbuild "$PROJECT" -t:Verify -p:TargetFramework=net8.0 -p:ExpectedGenerator=compat
          dotnet msbuild "$PROJECT" -t:Verify -p:TargetFramework=net9.0 -p:ExpectedGenerator=compat
          dotnet msbuild "$PROJECT" -t:Verify -p:TargetFramework=net10.0 -p:ExpectedGenerator=modern
          dotnet msbuild "$PROJECT" -t:Verify -p:TargetFramework=net10.0-windows -p:ExpectedGenerator=modern
          dotnet msbuild "$PROJECT" -t:Verify -p:TargetFramework=net11.0 -p:ExpectedGenerator=modern

      - name: Restore multi-target consumer from unified package
        run: dotnet restore tests/AsyncEventBridge.PackageMultiTargetSmoke/AsyncEventBridge.PackageMultiTargetSmoke.csproj --source "$PWD/artifacts/unified" --source https://api.nuget.org/v3/index.json -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Build multi-target consumer from unified package
        run: dotnet build tests/AsyncEventBridge.PackageMultiTargetSmoke/AsyncEventBridge.PackageMultiTargetSmoke.csproj --configuration Release --no-restore -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Restore modern consumer from unified package
        run: dotnet restore tests/AsyncEventBridge.PackageSmoke/AsyncEventBridge.PackageSmoke.csproj --source "$PWD/artifacts/unified" --source https://api.nuget.org/v3/index.json -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Build modern consumer from unified package
        run: dotnet build tests/AsyncEventBridge.PackageSmoke/AsyncEventBridge.PackageSmoke.csproj --configuration Release --no-restore -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Restore modern runtime consumer from unified package
        run: dotnet restore tests/AsyncEventBridge.PackageRuntimeSmoke/AsyncEventBridge.PackageRuntimeSmoke.csproj --source "$PWD/artifacts/unified" --source https://api.nuget.org/v3/index.json -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Run modern runtime consumer from unified package
        run: timeout 15s dotnet run --project tests/AsyncEventBridge.PackageRuntimeSmoke/AsyncEventBridge.PackageRuntimeSmoke.csproj --configuration Release --no-restore -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Restore compatibility consumer from unified package
        run: dotnet restore compat/netstandard2.0/tests/AsyncEventBridge.PackageSmoke/AsyncEventBridge.PackageSmoke.csproj --source "$PWD/artifacts/unified" --source https://api.nuget.org/v3/index.json -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Build compatibility consumer from unified package
        run: dotnet build compat/netstandard2.0/tests/AsyncEventBridge.PackageSmoke/AsyncEventBridge.PackageSmoke.csproj --configuration Release --no-restore -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Restore compatibility runtime consumer from unified package
        run: dotnet restore compat/netstandard2.0/tests/AsyncEventBridge.PackageRuntimeSmoke/AsyncEventBridge.PackageRuntimeSmoke.csproj --source "$PWD/artifacts/unified" --source https://api.nuget.org/v3/index.json -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Run compatibility runtime consumer from unified package
        run: timeout 15s dotnet run --project compat/netstandard2.0/tests/AsyncEventBridge.PackageRuntimeSmoke/AsyncEventBridge.PackageRuntimeSmoke.csproj --configuration Release --no-restore -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Restore unified-package Native AOT consumer
        run: dotnet restore tests/AsyncEventBridge.PackageAotSmoke/AsyncEventBridge.PackageAotSmoke.csproj --runtime linux-x64 --source "$PWD/artifacts/unified" --source https://api.nuget.org/v3/index.json -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Publish unified-package Native AOT consumer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/unified-native-aot
          dotnet publish tests/AsyncEventBridge.PackageAotSmoke/AsyncEventBridge.PackageAotSmoke.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --no-restore \
            -p:AsyncEventBridgePackageVersion="$VERSION" \
            -o artifacts/unified-native-aot 2>&1 | tee artifacts/unified-native-aot.log
          if grep -E 'warning IL[0-9]{4}' artifacts/unified-native-aot.log; then
            echo "Native AOT/trimming warnings are not allowed."
            exit 1
          fi
          timeout 15s ./artifacts/unified-native-aot/AsyncEventBridge.PackageAotSmoke

      - name: Upload unified package
        uses: actions/upload-artifact@v4
        with:
          name: AsyncEventBridge-unified-${{ env.VERSION }}
          path: |
            artifacts/unified/AsyncEventBridge.${{ env.VERSION }}.nupkg
            artifacts/unified/AsyncEventBridge.${{ env.VERSION }}.snupkg
          if-no-files-found: error

  cross-platform:
    name: ${{ matrix.os }} convergence
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore modern solution
        run: dotnet restore AsyncEventBridge.sln

      - name: Build modern solution
        run: dotnet build AsyncEventBridge.sln --configuration Release --no-restore

      - name: Test modern solution
        run: dotnet test AsyncEventBridge.sln --configuration Release --no-build --no-restore

      - name: Restore compatibility solution
        run: dotnet restore compat/netstandard2.0/AsyncEventBridge.sln

      - name: Build compatibility solution
        run: dotnet build compat/netstandard2.0/AsyncEventBridge.sln --configuration Release --no-restore

      - name: Test compatibility solution
        run: dotnet test compat/netstandard2.0/AsyncEventBridge.sln --configuration Release --no-build --no-restore

      - name: Compile Unity runtime against Unity API stubs
        run: dotnet build tests/AsyncEventBridge.UnityCompileSmoke/AsyncEventBridge.UnityCompileSmoke.csproj --configuration Release
