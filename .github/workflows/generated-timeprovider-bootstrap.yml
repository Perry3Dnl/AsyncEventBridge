name: Generated TimeProvider finalizer

on:
  push:
    branches:
      - dotnet-latest

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Patch generated timeout APIs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing replacement target: {label}")
              return text.replace(old, new, 1)

          def replace_all(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing replacement target: {label}")
              return text.replace(old, new)

          old_signature = '        source.Append("global::System.Threading.CancellationToken cancellationToken = default)");'
          new_signature = '''        source.Append("global::System.Threading.CancellationToken cancellationToken = default");\n\n        if (includeTimeout)\n        {\n            source.Append(", global::System.TimeProvider? timeProvider = null");\n        }\n\n        source.Append(')');'''
          old_call = '''            source.AppendLine(",")\n                .AppendLine("            timeout);");'''
          new_call = '''            source.AppendLine(",")\n                .AppendLine("            timeout,")\n                .AppendLine("            timeProvider);");'''

          base = Path("src/AsyncEventBridge.Generators/AsyncEventBridgeGenerator.cs")
          text = base.read_text()
          text = replace_once(text, old_signature, new_signature, "base generated TimeProvider signature")
          text = replace_once(text, old_call, new_call, "base generated TimeProvider forwarding")
          base.write_text(text)

          adapter = Path("src/AsyncEventBridge.Generators/AsyncEventBridgeAdapterGenerator.cs")
          text = adapter.read_text()
          text = replace_once(text, old_signature, new_signature, "adapter generated TimeProvider signature")
          text = replace_all(text, old_call, new_call, "adapter generated TimeProvider forwarding")
          adapter.write_text(text)

          for path_text in [
              "tests/AsyncEventBridge.Generators.Tests/AsyncEventBridgeGeneratorTests.cs",
              "tests/AsyncEventBridge.Generators.Tests/AsyncEventBridgeAdapterGeneratorTests.cs",
          ]:
              path = Path(path_text)
              text = path.read_text()
              text = text.replace(
                  "                    TimeSpan? timeout = null) => throw new NotImplementedException();",
                  "                    TimeSpan? timeout = null,\n                    TimeProvider? timeProvider = null) => throw new NotImplementedException();")
              path.write_text(text)

          base_tests = Path("tests/AsyncEventBridge.Generators.Tests/AsyncEventBridgeGeneratorTests.cs")
          text = base_tests.read_text()
          marker = '''        Assert.Contains("global::System.TimeSpan timeout", generatedSource, StringComparison.Ordinal);'''
          text = replace_once(
              text,
              marker,
              marker + '\n        Assert.Contains("global::System.TimeProvider? timeProvider = null", generatedSource, StringComparison.Ordinal);\n        Assert.Contains("timeProvider);", generatedSource, StringComparison.Ordinal);',
              "base generator TimeProvider assertions")
          base_tests.write_text(text)

          adapter_tests = Path("tests/AsyncEventBridge.Generators.Tests/AsyncEventBridgeAdapterGeneratorTests.cs")
          text = adapter_tests.read_text()
          marker = '''        Assert.Contains("IAsyncEnumerable<global::Demo.SensorEventArgs> ChangedStream", generatedSource, StringComparison.Ordinal);'''
          text = replace_once(
              text,
              marker,
              marker + '\n        Assert.Contains("global::System.TimeProvider? timeProvider = null", generatedSource, StringComparison.Ordinal);\n        Assert.Contains("timeProvider);", generatedSource, StringComparison.Ordinal);',
              "adapter generator TimeProvider assertions")
          adapter_tests.write_text(text)

          smoke = Path("tests/AsyncEventBridge.PackageRuntimeSmoke/Program.cs")
          text = smoke.read_text()
          text = replace_once(
              text,
              '''var modernWait = modernSensor.ValueChangedAsync();''',
              '''var modernWait = modernSensor.ValueChangedAsync(\n    TimeSpan.FromSeconds(1),\n    timeProvider: TimeProvider.System);''',
              "packaged modern generated TimeProvider call")
          text = replace_once(
              text,
              '''var strongSenderWait = strongSenderSensor.ValueChangedAsync();''',
              '''var strongSenderWait = strongSenderSensor.ValueChangedAsync(\n    TimeSpan.FromSeconds(1),\n    timeProvider: TimeProvider.System);''',
              "packaged strong sender generated TimeProvider call")
          smoke.write_text(text)
          PY

          git diff --check

      - name: Restore
        run: dotnet restore AsyncEventBridge.sln

      - name: Build
        run: dotnet build AsyncEventBridge.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AsyncEventBridge.sln --configuration Release --no-build --no-restore

      - name: Pack and exercise package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)
          mkdir -p artifacts/packages
          dotnet pack src/AsyncEventBridge/AsyncEventBridge.csproj --configuration Release --no-build --no-restore -o artifacts/packages
          dotnet restore tests/AsyncEventBridge.PackageRuntimeSmoke/AsyncEventBridge.PackageRuntimeSmoke.csproj \
            --source "$PWD/artifacts/packages" \
            --source https://api.nuget.org/v3/index.json \
            -p:AsyncEventBridgePackageVersion="$VERSION"
          dotnet run --project tests/AsyncEventBridge.PackageRuntimeSmoke/AsyncEventBridge.PackageRuntimeSmoke.csproj \
            --configuration Release \
            --no-restore \
            -p:AsyncEventBridgePackageVersion="$VERSION"

      - name: Commit finalized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AsyncEventBridge.Generators tests/AsyncEventBridge.Generators.Tests tests/AsyncEventBridge.PackageRuntimeSmoke
          if git diff --cached --quiet; then
            echo "No generated TimeProvider changes to commit."
            exit 0
          fi
          git commit -m "Expose TimeProvider in generated event waits"
          git push origin HEAD:dotnet-latest
