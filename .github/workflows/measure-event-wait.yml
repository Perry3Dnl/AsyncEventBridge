name: Measure event wait baseline

on:
  push:
    branches:
      - dotnet-latest
    paths:
      - .github/workflows/measure-event-wait.yml

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AsyncEventBridge.sln
      - run: dotnet build AsyncEventBridge.sln -c Release --no-restore
      - name: Measure WaitAndRaise baseline
        run: dotnet run -c Release --project benchmarks/AsyncEventBridge.Benchmarks --no-build -- --filter "*WaitAndRaise*" --warmupCount 3 --iterationCount 5
