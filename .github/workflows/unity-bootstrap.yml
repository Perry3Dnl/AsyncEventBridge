name: Bootstrap Unity package payload

on:
  push:
    branches:
      - feature/unity-package

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply reviewed Unity payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/unity-update.payload.b64 | tar -xz -C .

      - name: Build Unity source generator
        run: dotnet build src/AsyncEventBridge.Unity.Generators/AsyncEventBridge.Unity.Generators.csproj --configuration Release

      - name: Bundle generator in UPM package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Packages/com.perry3d.async-event-bridge/Analyzers
          cp src/AsyncEventBridge.Unity.Generators/bin/Release/netstandard2.0/AsyncEventBridge.Unity.Generators.dll \
             Packages/com.perry3d.async-event-bridge/Analyzers/AsyncEventBridge.Unity.Generators.dll

      - name: Commit Unity integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md Packages/com.perry3d.async-event-bridge
          git diff --cached --check
          git commit -m 'Integrate UnityEvent APIs and Unity tests'
          git push origin HEAD:feature/unity-package
