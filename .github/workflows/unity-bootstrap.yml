name: Finalize Unity integration

on:
  push:
    branches:
      - feature/unity-package

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply final reviewed Unity payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/unity-update.payload.b64 | tar -xz -C .

      - name: Make shared runtime Unity C# 9 portable
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path('.')
          core = root / 'src/AsyncEventBridge'
          unity_core = root / 'Packages/com.perry3d.async-event-bridge/Runtime/Core'

          portable_usings = [
              'System',
              'System.Collections',
              'System.Collections.Generic',
              'System.Diagnostics',
              'System.Linq',
              'System.Runtime.CompilerServices',
              'System.Runtime.ExceptionServices',
              'System.Threading',
              'System.Threading.Tasks',
          ]

          def read(path):
              return path.read_text(encoding='utf-8-sig')

          def write(path, text):
              path.write_text(text, encoding='utf-8', newline='\n')

          def block_namespace(path):
              text = read(path)
              match = re.search(r'(?m)^namespace ([A-Za-z_][A-Za-z0-9_.]*);\n', text)
              if not match:
                  return
              name = match.group(1)
              body = text[match.end():].rstrip()
              text = text[:match.start()] + f'namespace {name}\n{{\n' + body + '\n}\n'
              write(path, text)

          for path in sorted(core.glob('*.cs')):
              if path.name == 'AssemblyInfo.cs':
                  continue
              text = read(path)
              missing = [name for name in portable_usings if f'using {name};' not in text]
              if missing:
                  prefix = ''.join(f'using {name};\n' for name in missing) + '\n'
                  text = prefix + text
                  write(path, text)
              block_namespace(path)

          project = core / 'AsyncEventBridge.csproj'
          project_text = read(project)
          marker = '    <TargetFrameworks>netstandard2.0;netstandard2.1</TargetFrameworks>\n'
          if '<LangVersion>9.0</LangVersion>' not in project_text:
              project_text = project_text.replace(
                  marker,
                  marker + '    <LangVersion>9.0</LangVersion>\n    <ImplicitUsings>disable</ImplicitUsings>\n',
                  1)
          write(project, project_text)

          unity_core.mkdir(parents=True, exist_ok=True)
          for path in sorted(core.glob('*.cs')):
              if path.name != 'AssemblyInfo.cs':
                  shutil.copyfile(path, unity_core / path.name)

          package = root / 'Packages/com.perry3d.async-event-bridge'
          for path in list((package / 'Runtime/Unity').glob('*.cs')) + list((package / 'Tests').rglob('*.cs')):
              block_namespace(path)
          PY

      - name: Compile complete UPM runtime under C# 9
        run: dotnet build tests/AsyncEventBridge.UnityCompileSmoke/AsyncEventBridge.UnityCompileSmoke.csproj --configuration Release

      - name: Build solution
        run: dotnet build AsyncEventBridge.sln --configuration Release

      - name: Verify bundled generator is reproducible
        shell: bash
        run: |
          set -euo pipefail
          cmp \
            Packages/com.perry3d.async-event-bridge/Analyzers/AsyncEventBridge.Unity.Generators.dll \
            src/AsyncEventBridge.Unity.Generators/bin/Release/netstandard2.0/AsyncEventBridge.Unity.Generators.dll

      - name: Commit final Unity integration
        shell: bash
        run: |
          set -euo pipefail
          rm .github/unity-update.payload.b64 .github/workflows/unity-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Make Unity runtime C# 9 portable'
          git push origin HEAD:feature/unity-package
