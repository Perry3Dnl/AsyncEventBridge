name: Finalize Unity integration

on:
  push:
    branches:
      - feature/unity-package

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply final reviewed Unity payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/unity-update.payload.b64 | tar -xz -C .

      - name: Compile Unity runtime API surface
        run: dotnet build tests/AsyncEventBridge.UnityCompileSmoke/AsyncEventBridge.UnityCompileSmoke.csproj --configuration Release

      - name: Verify bundled generator is reproducible
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/AsyncEventBridge.Unity.Generators/AsyncEventBridge.Unity.Generators.csproj --configuration Release
          cmp \
            Packages/com.perry3d.async-event-bridge/Analyzers/AsyncEventBridge.Unity.Generators.dll \
            src/AsyncEventBridge.Unity.Generators/bin/Release/netstandard2.0/AsyncEventBridge.Unity.Generators.dll

      - name: Commit final Unity integration
        shell: bash
        run: |
          set -euo pipefail
          rm .github/unity-update.payload.b64 .github/workflows/unity-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden Unity lifecycle and CI'
          git push origin HEAD:feature/unity-package
