name: Finalize diagnostics formatting

on:
  push:
    branches:
      - dotnet-latest

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Harden diagnostics formatting cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Normalize inserted blocks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/AsyncEventBridge.Generators/AsyncEventBridgeAdapterGenerator.cs')
          text = path.read_text()
          i4 = ' ' * 4
          i8 = ' ' * 8
          i12 = ' ' * 12
          i16 = ' ' * 16
          i20 = ' ' * 20

          start = text.index('    private static readonly DiagnosticDescriptor InvalidGenerationTarget = new(')
          end = text.index('\n\n    private static readonly DiagnosticDescriptor RedundantGenerationRequest', start)
          descriptor = (
              i4 + 'private static readonly DiagnosticDescriptor InvalidGenerationTarget = new(\n'
              + i8 + 'id: "AEB002",\n'
              + i8 + 'title: "Invalid async-event generation target",\n'
              + i8 + 'messageFormat: "Type \'{0}\' cannot be targeted by GenerateAsyncEventsFor. Generated async-event adapters require a supported class type.",\n'
              + i8 + 'category: "AsyncEventBridge",\n'
              + i8 + 'defaultSeverity: DiagnosticSeverity.Warning,\n'
              + i8 + 'isEnabledByDefault: true);'
          )
          text = text[:start] + descriptor + text[end:]

          start = text.index('            var targetType = requestedType.IsUnboundGenericType')
          end = text.index('\n\n        }\n\n        if (targets.Count == 0)', start)
          block = (
              i12 + 'var targetType = requestedType.IsUnboundGenericType\n'
              + i16 + '? requestedType.OriginalDefinition\n'
              + i16 + ': requestedType;\n'
              + i12 + 'var location = request.ApplicationSyntaxReference?.GetSyntax(context.CancellationToken).GetLocation()\n'
              + i16 + '?? Location.None;\n\n'
              + i12 + 'if (!CanGenerateForType(targetType))\n'
              + i12 + '{\n'
              + i16 + 'context.ReportDiagnostic(Diagnostic.Create(\n'
              + i20 + 'InvalidGenerationTarget,\n'
              + i20 + 'location,\n'
              + i20 + 'targetType.ToDisplayString()));\n'
              + i16 + 'continue;\n'
              + i12 + '}\n\n'
              + i12 + 'if (targets.ContainsKey(targetType))\n'
              + i12 + '{\n'
              + i16 + 'context.ReportDiagnostic(Diagnostic.Create(\n'
              + i20 + 'RedundantGenerationRequest,\n'
              + i20 + 'location,\n'
              + i20 + 'targetType.ToDisplayString()));\n'
              + i16 + 'continue;\n'
              + i12 + '}\n\n'
              + i12 + 'targets.Add(targetType, location);'
          )
          text = text[:start] + block + text[end:]
          path.write_text(text)
          PY

      - name: Restore
        run: dotnet restore tests/AsyncEventBridge.Generators.Tests/AsyncEventBridge.Generators.Tests.csproj

      - name: Verify whitespace
        run: git diff --check

      - name: Build generator tests
        run: dotnet build tests/AsyncEventBridge.Generators.Tests/AsyncEventBridge.Generators.Tests.csproj -c Release --no-restore

      - name: Run generator tests
        run: dotnet test tests/AsyncEventBridge.Generators.Tests/AsyncEventBridge.Generators.Tests.csproj -c Release --no-build --no-restore

      - name: Commit clean source
        shell: bash
        run: |
          git config user.name "Perry"
          git config user.email "its_Q@hotmail.com"
          git rm .github/workflows/finalize-diagnostics-formatting.yml
          git add src/AsyncEventBridge.Generators/AsyncEventBridgeAdapterGenerator.cs
          git commit -m "Clean up generator diagnostics formatting"
          git push origin HEAD:dotnet-latest
