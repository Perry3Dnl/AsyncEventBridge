name: Unity 1.0 Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  package-tests:
    name: Unity package ${{ matrix.testMode }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode:
          - editmode
          - playmode

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Unity package tests
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          packageMode: true
          projectPath: Packages/com.perry3d.async-event-bridge
          unityVersion: 2023.1.0f1
          testMode: ${{ matrix.testMode }}
          artifactsPath: artifacts/unity-tests/${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity package ${{ matrix.testMode }}

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-${{ matrix.testMode }}-results
          path: ${{ steps.unity-tests.outputs.artifactsPath }}
          if-no-files-found: warn

  il2cpp:
    name: Unity IL2CPP acceptance
    runs-on: ubuntu-latest
    needs: package-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build IL2CPP acceptance player
        id: unity-build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: tests/UnityAcceptanceProject
          unityVersion: 2023.1.0f1
          targetPlatform: StandaloneLinux64
          buildMethod: AsyncEventBridgeAcceptance.Il2CppBuild.PerformBuild
          versioning: None
          allowDirtyBuild: true

      - name: Verify IL2CPP player
        shell: bash
        run: |
          set -euo pipefail
          test -x tests/UnityAcceptanceProject/build/AsyncEventBridgeAcceptance.x86_64

      - name: Upload IL2CPP player
        uses: actions/upload-artifact@v4
        with:
          name: unity-il2cpp-acceptance
          path: tests/UnityAcceptanceProject/build/
          if-no-files-found: error
