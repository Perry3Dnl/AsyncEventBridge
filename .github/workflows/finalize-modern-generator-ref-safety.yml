name: Finalize modern generator ref safety

on:
  push:
    branches:
      - dotnet-latest
    paths:
      - .github/workflows/finalize-modern-generator-ref-safety.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dotnet-latest
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply ref-safety fixes and tests
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}")
              p.write_text(text.replace(old, new))

          for path in [
              "src/AsyncEventBridge.Generators/AsyncEventBridge.Generators.csproj",
              "tests/AsyncEventBridge.Generators.Tests/AsyncEventBridge.Generators.Tests.csproj",
          ]:
              replace_exact(path, 'Version="4.11.0"', 'Version="4.12.0"')

          payload_old = '''    private static bool IsAsyncPayloadCompatible(ITypeSymbol typeSymbol) =>
                  !typeSymbol.IsRefLikeType;
          '''
          payload_new = '''    private static bool IsAsyncPayloadCompatible(ITypeSymbol typeSymbol) =>
                  !typeSymbol.IsRefLikeType &&
                  (typeSymbol is not ITypeParameterSymbol typeParameter || !typeParameter.AllowsRefLikeType);
          '''

          constraint_old = '''        if (parameter.HasConstructorConstraint &&
                      !parameter.HasValueTypeConstraint &&
                      !parameter.HasUnmanagedTypeConstraint)
                  {
                      constraints.Add("new()");
                  }
          
                  return constraints;
          '''
          constraint_new = '''        if (parameter.HasConstructorConstraint &&
                      !parameter.HasValueTypeConstraint &&
                      !parameter.HasUnmanagedTypeConstraint)
                  {
                      constraints.Add("new()");
                  }
          
                  if (parameter.AllowsRefLikeType)
                  {
                      constraints.Add("allows ref struct");
                  }
          
                  return constraints;
          '''

          for path in [
              "src/AsyncEventBridge.Generators/AsyncEventBridgeGenerator.cs",
              "src/AsyncEventBridge.Generators/AsyncEventBridgeAdapterGenerator.cs",
          ]:
              replace_exact(path, payload_old, payload_new)
              replace_exact(path, constraint_old, constraint_new)

          direct_path = Path("tests/AsyncEventBridge.Generators.Tests/AsyncEventBridgeGeneratorTests.cs")
          direct = direct_path.read_text()
          direct_marker = '''    [Fact]
              public void GeneratedSourceCompilesWithCSharp8()
          '''
          direct_tests = '''    [Fact]
              public void DoesNotGenerateForPayloadTypeParameterThatAllowsRefStruct()
              {
                  var source = RuntimeStubs + """
                      namespace Demo
                      {
                          [AsyncEventBridge.GenerateAsyncEvents]
                          public sealed class Sensor<TPayload>
                              where TPayload : allows ref struct
                          {
                              public event EventHandler<TPayload>? Changed;
                          }
                      }
                      """;
          
                  var result = RunGenerator(source, LanguageVersion.CSharp13);
          
                  Assert.Empty(Assert.Single(result.Results).GeneratedSources);
                  Assert.Empty(result.Diagnostics.Where(diagnostic => diagnostic.Severity == DiagnosticSeverity.Error));
              }
          
              [Fact]
              public void CopiesAllowsRefStructConstraintForGenericSourceType()
              {
                  var source = RuntimeStubs + """
                      namespace Demo
                      {
                          [AsyncEventBridge.GenerateAsyncEvents]
                          public sealed class Sensor<TState>
                              where TState : allows ref struct
                          {
                              public event EventHandler<int>? Changed;
                          }
                      }
                      """;
          
                  var result = RunGenerator(source, LanguageVersion.CSharp13);
                  var generatedSource = Assert.Single(Assert.Single(result.Results).GeneratedSources).SourceText.ToString();
          
                  Assert.Contains("where TSource0 : allows ref struct", generatedSource, StringComparison.Ordinal);
                  Assert.Contains("Task<global::System.Int32> ChangedAsync", generatedSource, StringComparison.Ordinal);
              }
          
          ''' + direct_marker
          if direct.count(direct_marker) != 1:
              raise SystemExit("direct generator test insertion marker not found exactly once")
          direct_path.write_text(direct.replace(direct_marker, direct_tests))

          adapter_path = Path("tests/AsyncEventBridge.Generators.Tests/AsyncEventBridgeAdapterGeneratorTests.cs")
          adapter = adapter_path.read_text()
          adapter_marker = '''    [Fact]
              public void ReportsAeb001ForRefLikePayload()
          '''
          adapter_tests = '''    [Fact]
              public void ReportsAeb001ForPayloadTypeParameterThatAllowsRefStruct()
              {
                  var source = RuntimeStubs + """
                      namespace Demo
                      {
                          [AsyncEventBridge.GenerateAsyncEvents]
                          public sealed class Sensor<TPayload>
                              where TPayload : allows ref struct
                          {
                              public event EventHandler<Sensor<TPayload>, TPayload>? Changed;
                          }
                      }
                      """;
          
                  var result = RunGenerator(
                      source,
                      allowGeneratorWarnings: true,
                      languageVersion: LanguageVersion.CSharp13);
                  var diagnostic = Assert.Single(result.Diagnostics.Where(diagnostic => diagnostic.Id == "AEB001"));
          
                  Assert.Contains("Changed", diagnostic.GetMessage(), StringComparison.Ordinal);
                  Assert.Empty(Assert.Single(result.Results).GeneratedSources);
              }
          
              [Fact]
              public void CopiesAllowsRefStructConstraintForStrongSenderSourceType()
              {
                  var source = RuntimeStubs + """
                      namespace Demo
                      {
                          [AsyncEventBridge.GenerateAsyncEvents]
                          public sealed class Sensor<TState>
                              where TState : allows ref struct
                          {
                              public event EventHandler<Sensor<TState>, int>? Changed;
                          }
                      }
                      """;
          
                  var result = RunGenerator(source, languageVersion: LanguageVersion.CSharp13);
                  var generatedSource = Assert.Single(Assert.Single(result.Results).GeneratedSources).SourceText.ToString();
          
                  Assert.Contains("where TSource0 : allows ref struct", generatedSource, StringComparison.Ordinal);
                  Assert.Contains("ChangedAsync", generatedSource, StringComparison.Ordinal);
              }
          
          ''' + adapter_marker
          if adapter.count(adapter_marker) != 1:
              raise SystemExit("adapter generator test insertion marker not found exactly once")
          adapter = adapter.replace(adapter_marker, adapter_tests)

          helper_old = '''    private static GeneratorDriverRunResult RunGenerator(
                  string source,
                  bool allowGeneratorWarnings = false,
                  IReadOnlyList<MetadataReference>? additionalReferences = null)
              {
                  var parseOptions = new CSharpParseOptions(LanguageVersion.CSharp8);
          '''
          helper_new = '''    private static GeneratorDriverRunResult RunGenerator(
                  string source,
                  bool allowGeneratorWarnings = false,
                  IReadOnlyList<MetadataReference>? additionalReferences = null,
                  LanguageVersion languageVersion = LanguageVersion.CSharp8)
              {
                  var parseOptions = new CSharpParseOptions(languageVersion);
          '''
          if adapter.count(helper_old) != 1:
              raise SystemExit("adapter RunGenerator helper marker not found exactly once")
          adapter_path.write_text(adapter.replace(helper_old, helper_new))

      - name: Restore
        run: dotnet restore AsyncEventBridge.sln

      - name: Build
        run: dotnet build AsyncEventBridge.sln -c Release --no-restore

      - name: Test
        run: dotnet test AsyncEventBridge.sln -c Release --no-build

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-modern-generator-ref-safety.yml
          git config user.name "Perry"
          git config user.email "its_Q@hotmail.com"
          git add -A
          git commit -m "Harden modern generator ref safety"
          git push origin HEAD:dotnet-latest
